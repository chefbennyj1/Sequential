<div class="library-settings dashboard-section hidden glass glass--frosted glass-card">
    <button class="glass glass-btn glass-btn--sm glass-btn--ghost back-to-studio-btn studio-back-btn">&larr; Back to
        Studio</button>
    <div class="narrow-container padding-20">
        <h3>Library Settings</h3>
        <p class="text-muted margin-b-20">Configure global defaults for your series.</p>

        <div id="series-settings-form-container" class="margin-t-20 glass glass--dark glass-card padding-30 border-dim">
            <div class="form-group margin-b-20">
                <label>Select Series to Configure</label>
                <select id="settingsSeriesSelect" class="glass-select">
                    <option value="">Select a Series</option>
                </select>
            </div>

            <form id="library-settings-form" class="hidden">
                <input type="hidden" id="settings-series-id">

                <button type="submit" class="glass glass-btn glass-btn--primary width-100 margin-t-20">Save Library
                    Settings</button>
            </form>
        </div>

        <hr class="margin-y-40 border-dim">

        <h3>AI Settings</h3>
        <p class="text-muted margin-b-20">Configure global Gemini AI integration.</p>

        <div id="global-settings-form-container" class="glass glass--dark glass-card">
            <form id="global-settings-form">
                <div class="form-group">
                    <label class="flex-row align-center gap-10">
                        <input type="checkbox" id="global-vision-enabled">
                        <span>Enable Gemini Vision AI</span>
                    </label>
                    <p class="font-size-07 text-muted margin-t-5">Automatic panel image description via Google Gemini
                    </p>
                </div>

                <div id="vision-settings-fields" class="margin-t-20 border-dim padding-20 border-radius-8">
                    <div class="form-group">
                        <label>Gemini API Key</label>
                        <div class="flex-row gap-10 align-center">
                            <input type="password" id="global-api-key" class="glass-input flex-1"
                                placeholder="Paste your API key here">
                            <a href="https://aistudio.google.com/app/apikey" target="_blank"
                                class="small btn-browse text-center"
                                style="text-decoration: none; display: inline-block; padding: 10px;">Get API Key</a>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Gemini Model Version</label>
                        <select id="global-model-name" class="glass-select width-100">
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fast, Stable)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Detailed, Slower)</option>
                            <option value="gemini-flash-latest">Gemini Flash Latest (2026 Standard)</option>
                            <option value="gemini-3.1-flash-image-preview">Gemini 3.1 Flash Image Preview (Advanced
                                Vision)</option>
                            <option value="gemini-3-pro-image-preview">Gemini 3.0 Pro Image Preview</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Vision System Prompt</label>
                        <textarea id="global-system-prompt" class="glass-input width-100" rows="3"></textarea>
                    </div>
                    <div class="flex-row gap-15">
                        <div class="form-group flex-1">
                            <label>Max Tokens</label>
                            <input type="number" id="global-max-tokens" class="glass-input width-100" value="100">
                        </div>
                        <div class="form-group flex-1">
                            <label>Temperature</label>
                            <input type="number" id="global-temperature" class="glass-input width-100" step="0.1"
                                value="0.2">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="flex-row align-center gap-10">
                            <input type="checkbox" id="global-auto-scan" checked>
                            <span>Auto-Scan on Page Save</span>
                        </label>
                    </div>
                </div>

                <div class="margin-t-30 flex-row gap-15">
                    <button type="submit" class="glass glass-btn glass-btn--primary flex-2"
                        id="saveGlobalSettingsBtn">Save AI Settings</button>
                </div>
            </form>
        </div>
    </div>
</div>
