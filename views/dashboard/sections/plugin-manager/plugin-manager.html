<div class="plugin-manager fade-in dashboard-section max-width-wrapper margin-auto padding-x-20 padding-y-30">
    <div class="header-stack margin-b-30">
        <div>
            <h2 class="text-accent uppercase margin-0"><ion-icon name="extension-puzzle-outline"></ion-icon> Plugin Manager</h2>
            <p class="text-muted margin-t-5 font-size-09">Enable or disable backend plugins. A server restart is required for routing changes to take effect.</p>
        </div>
        <button id="refreshPluginsBtn" class="glass glass-btn glass-btn--ghost glass-btn--sm">
            <ion-icon name="refresh-outline"></ion-icon> Refresh
        </button>
    </div>

    <div class="glass glass-card padding-20">
        <div id="pluginListContainer" class="flex-column gap-15">
            <div class="text-center text-muted padding-y-20">
                <ion-icon name="sync-outline" class="spin font-size-2"></ion-icon>
                <p>Loading plugins...</p>
            </div>
        </div>
    </div>
</div>
