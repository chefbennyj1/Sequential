<div class="page-builder dashboard-section hidden glass glass--frosted glass-card">
    <!-- Persistent tool rail: every page-management mode, always one click away -->
    <nav id="pageBuilderToolbar" class="pb-toolbar" aria-label="Page management">
        <button type="button" class="pb-tool" id="modeCreateBtn" data-pane="createPageContainer"
            title="New Page" aria-label="New Page">
            <ion-icon name="add-circle-outline"></ion-icon>
        </button>
        <button type="button" class="pb-tool" id="modeInsertBtn" data-pane="insertPageContainer"
            title="Insert Page" aria-label="Insert Page">
            <ion-icon name="git-branch-outline"></ion-icon>
        </button>
        <button type="button" class="pb-tool" id="modeLayoutBtn" data-pane="layoutPageContainer"
            title="Page Layout" aria-label="Page Layout">
            <ion-icon name="grid-outline"></ion-icon>
        </button>
        <button type="button" class="pb-tool" id="modeArrangeBtn" data-pane="arrangePagesContainer"
            title="Arrange Pages" aria-label="Arrange Pages">
            <ion-icon name="swap-horizontal-outline"></ion-icon>
        </button>
        <button type="button" class="pb-tool" id="modeScriptBtn" data-pane="exportScriptContainer"
            title="Export Script" aria-label="Export Script">
            <ion-icon name="document-text-outline"></ion-icon>
        </button>
    </nav>

    <div class="pb-workarea">
    <!-- Persistent context bar: active-page breadcrumb (opens navigation) + Editor launcher -->
    <div id="activePageToolbar" class="pb-context-bar">
        <div class="pb-context-nav">
            <button type="button" id="activePageCrumb" class="pb-crumb" aria-haspopup="true"
                aria-expanded="false">
                <span class="text-muted font-size-07 uppercase">Active Page</span>
                <span id="activePageDisplay" class="pb-crumb__path text-accent">Select a page</span>
                <ion-icon name="chevron-down-outline"></ion-icon>
            </button>
            <div id="pageNavPopover" class="pb-nav-popover glass glass--dark glass-card hidden">
                <div class="form-group margin-b-15">
                    <label>Series</label>
                    <select id="editSeriesSelect"></select>
                </div>
                <div class="form-group margin-b-15">
                    <label>Volume</label>
                    <select id="editVolumeSelect" disabled>
                        <option value="">Select a Series first</option>
                    </select>
                </div>
                <div class="form-group margin-b-15">
                    <label>Chapter</label>
                    <select id="editChapterSelect" disabled>
                        <option value="">Select a Volume first</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Page</label>
                    <select id="editPageSelect" disabled>
                        <option value="">Select a Page</option>
                    </select>
                </div>
            </div>
        </div>
        <button id="openLayoutEditorBtn" class="glass glass-btn glass-btn--primary" disabled>Editor</button>
    </div>

    <div id="pageBuilderAlerts" class="pb-alerts"></div>

    <div class="narrow-container padding-20">

        <!-- CREATE PAGE -->
        <div id="createPageContainer" class="glass glass--dark glass-card hidden">
            <div class="form-group"><label>Select Series</label><select id="builderSeriesSelect"></select></div>
            <div class="form-group"><label>Select Volume</label><select id="builderVolumeSelect" disabled>
                    <option value="">Select a Series first</option>
                </select></div>
            <div class="form-group"><label>Select Chapter</label><select id="builderChapterSelect" disabled>
                    <option value="">Select a Volume first</option>
                </select></div>
            <form id="page-builder-form">
                <div class="input-field">
                    <label>Page ID</label>
                    <div class="flex-row gap-10">
                        <input type="text" id="builderPageId" name="pageId" placeholder="page17" required />
                        <button type="button" id="getNextPageIdBtn"
                            class="glass glass-btn glass-btn--sm glass-btn--primary">Next Consecutive</button>
                    </div>
                </div>
                <div class="form-group"><label>Select Layout Template</label><select id="builderLayoutSelect" required>
                        <option value="">Loading Layouts...</option>
                    </select></div>
                <button class="glass glass-btn glass-btn--primary width-100" type="submit" id="createPageBtn">Create Page
                    Structure</button>
            </form>
            <div id="builderStatus" class="builder-status"></div>
        </div>

        <!-- INSERT PAGE -->
        <div id="insertPageContainer" class="glass glass--dark glass-card hidden">
            <div class="form-group"><label>Select Series</label><select id="insertSeriesSelect"></select></div>
            <div class="form-group"><label>Select Volume</label><select id="insertVolumeSelect" disabled>
                    <option value="">Select a Series first</option>
                </select></div>
            <div class="form-group"><label>Select Chapter</label><select id="insertChapterSelect" disabled>
                    <option value="">Select a Volume first</option>
                </select></div>
            <form id="insert-page-form">
                <div class="input-field"><label>Insert At Index</label><input type="number" id="insertPoint"
                        name="insertPoint" required /></div>
                <button class="glass glass-btn glass-btn--primary width-100" type="submit" id="insertPageBtn">Insert &
                    Shift Pages</button>
            </form>
            <div id="insertStatus" class="builder-status"></div>
        </div>

        <!-- ARRANGE PAGES -->
        <div id="arrangePagesContainer" class="glass glass--dark glass-card hidden">
            <div class="flex-row gap-15 margin-b-20">
                <div class="form-group flex-1"><label>Series</label><select id="arrangeSeriesSelect"></select></div>
                <div class="form-group flex-1"><label>Volume</label><select id="arrangeVolumeSelect" disabled>
                        <option value="">Select a Series first</option>
                    </select></div>
                <div class="form-group flex-1"><label>Chapter</label><select id="arrangeChapterSelect" disabled>
                        <option value="">Select a Volume first</option>
                    </select></div>
            </div>
            <div id="arrangePagesList" class="arrange-pages-list margin-t-20"></div>
            <div class="margin-t-30 flex-row gap-15">
                <button id="savePageOrderBtn" class="glass glass-btn glass-btn--primary flex-1" disabled>Save New
                    Order</button>
                <button id="resetPageOrderBtn" class="glass glass-btn glass-btn--sm glass-btn--ghost flex-1"
                    disabled>Reset</button>
            </div>
        </div>

        <!-- EXPORT SCRIPT -->
        <div id="exportScriptContainer" class="glass glass--dark glass-card hidden">
            <div class="form-group"><label>Select Series</label><select id="scriptSeriesSelect"
                    class="glass-select"></select></div>
            <div class="form-group"><label>Select Volume</label><select id="scriptVolumeSelect" class="glass-select"
                    disabled>
                    <option value="">Select a Series first</option>
                </select></div>
            <button class="glass glass-btn glass-btn--primary width-100 margin-t-20" id="generateScriptBtn">Generate Script
                File</button>
            <div id="scriptStatus" class="builder-status"></div>
        </div>

        <!-- END OF NARROW CONTAINER -->
    </div>

    <!-- PAGE LAYOUT (full-width template browser for the active page) -->
    <div id="layoutPageContainer" class="hidden">
        <div id="layoutEmptyState" class="pb-empty-state hidden">
            <ion-icon name="grid-outline"></ion-icon>
            <p class="text-muted">No active page selected.</p>
            <button type="button" id="layoutEmptyPickBtn" class="glass glass-btn glass-btn--primary">Select a
                Page</button>
        </div>
        <div id="layoutBrowserWrap" class="pb-layout-wrap">
            <label class="margin-b-15 uppercase text-accent">Structural Layout</label>
            <input type="hidden" id="activePageLayoutValue">
            <div id="activePageLayoutBrowser" class="layout-browser-grid"></div>
            <button id="applyLayoutBtn" class="glass glass-btn glass-btn--primary width-100 margin-t-20">Apply
                Selected Layout</button>
        </div>
    </div>
    <!-- END OF WORKAREA -->
    </div>
</div>
