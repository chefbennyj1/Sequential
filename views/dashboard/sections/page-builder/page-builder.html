    <div class="page-builder dashboard-section hidden glass glass--frosted glass-card">
        <div class="narrow-container padding-20">
            <button class="glass glass-btn glass-btn--sm glass-btn--ghost back-to-studio-btn margin-b-20">&larr; Back to Studio</button>
            <div id="pageBuilderAlerts" class="margin-b-20"></div>

            <div id="pageBuilderModeSelection" class="page-builder-selection">
                <h3>Page Management</h3>
                <div class="flex-row gap-20 justify-center">
                    <div class="glass glass-card mode-card" id="modeCreateBtn">
        <ion-icon name="add-circle-outline"></ion-icon>
        <h3 class="glass-card__title">New Page</h3>
    </div>
                    <div class="glass glass-card mode-card" id="modeInsertBtn">
        <ion-icon name="git-branch-outline"></ion-icon>
        <h3 class="glass-card__title">Insert Page</h3>
    </div>
                    <div class="glass glass-card mode-card" id="modeEditBtn">
        <ion-icon name="create-outline"></ion-icon>
        <h3 class="glass-card__title">Edit Page</h3>
    </div>
                    <div class="glass glass-card mode-card" id="modeArrangeBtn">
        <ion-icon name="swap-horizontal-outline"></ion-icon>
        <h3 class="glass-card__title">Arrange Pages</h3>
    </div>
                    <div class="glass glass-card mode-card" id="modeScriptBtn">
        <ion-icon name="document-text-outline"></ion-icon>
        <h3 class="glass-card__title">Export Script</h3>
    </div>
                </div>
            </div>

            <!-- CREATE PAGE -->
            <div id="createPageContainer" class="glass glass--dark glass-card hidden">
                <button class="glass glass-btn glass-btn--sm glass-btn--ghost mode-back-btn margin-b-15">&larr; Back</button>
                <div class="form-group"><label>Select Series</label><select id="builderSeriesSelect"></select></div>
                <div class="form-group"><label>Select Volume</label><select id="builderVolumeSelect" disabled><option value="">Select a Series first</option></select></div>
                <div class="form-group"><label>Select Chapter</label><select id="builderChapterSelect" disabled><option value="">Select a Volume first</option></select></div>
                <form id="page-builder-form">
                   <div class="input-field">
                       <label>Page ID</label>
                       <div class="flex-row gap-10">
                           <input type="text" id="builderPageId" name="pageId" placeholder="page17" required />
                           <button type="button" id="getNextPageIdBtn" class="glass glass-btn glass-btn--sm glass-btn--primary">Next Consecutive</button>
                       </div>
                   </div>
                   <div class="form-group"><label>Select Layout Template</label><select id="builderLayoutSelect" required><option value="">Loading Layouts...</option></select></div>
                   <button class="glass glass-btn glass-btn--primary w-full" type="submit" id="createPageBtn">Create Page Structure</button>
                </form>
                <div id="builderStatus" class="builder-status"></div>
            </div>

            <!-- INSERT PAGE -->
            <div id="insertPageContainer" class="glass glass--dark glass-card hidden">
                <button class="glass glass-btn glass-btn--sm glass-btn--ghost mode-back-btn margin-b-15">&larr; Back</button>
                <div class="form-group"><label>Select Series</label><select id="insertSeriesSelect"></select></div>
                <div class="form-group"><label>Select Volume</label><select id="insertVolumeSelect" disabled><option value="">Select a Series first</option></select></div>
                <div class="form-group"><label>Select Chapter</label><select id="insertChapterSelect" disabled><option value="">Select a Volume first</option></select></div>
                <form id="insert-page-form">
                    <div class="input-field"><label>Insert At Index</label><input type="number" id="insertPoint" name="insertPoint" required /></div>
                    <button class="glass glass-btn glass-btn--primary w-full" type="submit" id="insertPageBtn">Insert & Shift Pages</button>
                </form>
                <div id="insertStatus" class="builder-status"></div>
            </div>

            <!-- ARRANGE PAGES -->
            <div id="arrangePagesContainer" class="glass glass--dark glass-card hidden">
                <button class="glass glass-btn glass-btn--sm glass-btn--ghost mode-back-btn margin-b-15">&larr; Back</button>
                <div class="flex-row gap-15 margin-b-20">
                    <div class="form-group flex-1"><label>Series</label><select id="arrangeSeriesSelect"></select></div>
                    <div class="form-group flex-1"><label>Volume</label><select id="arrangeVolumeSelect" disabled><option value="">Select a Series first</option></select></div>
                    <div class="form-group flex-1"><label>Chapter</label><select id="arrangeChapterSelect" disabled><option value="">Select a Volume first</option></select></div>
                </div>
                <div id="arrangePagesList" class="arrange-pages-list margin-t-20"></div>
                <div class="margin-t-30 flex-row gap-15">
                    <button id="savePageOrderBtn" class="glass glass-btn glass-btn--primary flex-1" disabled>Save New Order</button>
                    <button id="resetPageOrderBtn" class="glass glass-btn glass-btn--sm glass-btn--ghost flex-1" disabled>Reset</button>
                </div>
            </div>

            <!-- EXPORT SCRIPT -->
            <div id="exportScriptContainer" class="glass glass--dark glass-card hidden">
                <button class="glass glass-btn glass-btn--sm glass-btn--ghost mode-back-btn margin-b-15">&larr; Back</button>
                <div class="form-group"><label>Select Series</label><select id="scriptSeriesSelect" class="glass-select"></select></div>
                <div class="form-group"><label>Select Volume</label><select id="scriptVolumeSelect" class="glass-select" disabled><option value="">Select a Series first</option></select></div>
                <button class="glass glass-btn glass-btn--primary w-full margin-t-20" id="generateScriptBtn">Generate Script File</button>
                <div id="scriptStatus" class="builder-status"></div>
            </div>

            <!-- EDIT PAGE -->
            <div id="editPageContainer" class="hidden">
                <button class="glass glass-btn glass-btn--sm glass-btn--ghost mode-back-btn margin-b-15">&larr; Back</button>
                <div class="glass glass--bright glass-card margin-b-30">
                    <div class="flex-row gap-15 margin-b-20">
                        <div class="form-group flex-1"><label>Series</label><select id="editSeriesSelect"></select></div>
                        <div class="form-group flex-1"><label>Volume</label><select id="editVolumeSelect" disabled><option value="">Select a Series first</option></select></div>
                        <div class="form-group flex-1"><label>Chapter</label><select id="editChapterSelect" disabled><option value="">Select a Volume first</option></select></div>
                        <div class="form-group flex-1"><label>Page</label><select id="editPageSelect" disabled><option value="">Select a Page</option></select></div>
                    </div>
                    <button id="loadPageBtn" class="glass glass-btn glass-btn--primary width-100 font-size-1-1">Load Page Tools</button>
                </div>

                <div id="activePageToolbar" class="hidden">
                    <div class="flex-between glass glass--bright border-radius-12 border-accent margin-b-30 padding-20">
                        <div><span class="text-muted font-size-07 uppercase">Active Page</span><h4 id="activePageDisplay" class="text-accent font-size-1-4">None</h4></div>
                        <div class="flex-row gap-15">
                            <button id="openLayoutEditorBtn" class="glass glass-btn glass-btn--primary">Visual Editor</button>
                        </div>
                    </div>
                    <div class="glass glass--bright glass-card margin-b-30">
                        <div class="form-group">
                            <label>Structural Layout</label>
                            <input type="hidden" id="activePageLayoutValue">
                            <div id="activePageLayoutBrowser" class="layout-browser-grid"></div>
                            <button id="applyLayoutBtn" class="glass glass-btn glass-btn--sm glass-btn--primary width-100 margin-t-15">Apply Selected Layout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
