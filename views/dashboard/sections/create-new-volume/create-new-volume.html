    <div class="create-new-volume dashboard-section hidden glass glass--frosted glass-card">
        <h3>Create New Volume</h3>
        <form id="volume-info">
            <div class="form-group">
                <label>Select Series</label>
                <select id="createVolumeSeriesSelect" name="seriesId" required></select>
            </div>
            <div class="input-field">
                <label for="index">Volume Index (Number)</label>
                <input type="number" id="index" name="index" placeholder="e.g. 1" required />
            </div>
            <div class="input-field">
                <label for="title">Volume Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. The Beginning" required />
            </div>
            <div class="input-field">
                <label for="firstChapterTitle">First Chapter Title</label>
                <input type="text" id="firstChapterTitle" name="firstChapterTitle" placeholder="e.g. Arrival" required />
            </div>
            <button class="glass glass-btn glass-btn--primary width-100" type="submit" id="createVolumeBtn">Create Volume Structure</button>
        </form>
        <div id="volumeStatus" class="builder-status"></div>
    </div>
