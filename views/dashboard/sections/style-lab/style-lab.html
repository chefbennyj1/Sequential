    <div class="style-lab dashboard-section hidden glass glass--frosted glass-card">
        <h3>Style Lab</h3>
        <p class="text-muted margin-b-20">Customize global typography and CSS.</p>

        <div class="flex-row gap-30">
            <!-- Left Side: Controls -->
            <div class="flex-1 glass glass--dark glass-card">
                <div class="form-group">
                    <label>Select Series</label>
                    <select id="styleLabSeriesSelect" class="glass-select"><option value="">Select a Series</option></select>
                </div>

                <div id="style-lab-controls" class="hidden margin-t-20">
                    <div class="form-group">
                        <label>Speech Bubble Font Size</label>
                        <div class="flex-row align-center gap-10">
                            <button class="btn-icon-small slider-step-btn" data-target="bubbleFontSizeSlider" data-step="-0.05"><ion-icon name="remove-circle-outline"></ion-icon></button>
                            <input type="range" id="bubbleFontSizeSlider" min="0.5" max="2.0" step="0.05" value="0.8" class="flex-1">
                            <button class="btn-icon-small slider-step-btn" data-target="bubbleFontSizeSlider" data-step="0.05"><ion-icon name="add-circle-outline"></ion-icon></button>
                            <span id="bubbleFontSizeValue" class="mono text-accent width-60">0.8rem</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Text Block Font Size</label>
                        <div class="flex-row align-center gap-10">
                            <button class="btn-icon-small slider-step-btn" data-target="textBlockFontSizeSlider" data-step="-0.05"><ion-icon name="remove-circle-outline"></ion-icon></button>
                            <input type="range" id="textBlockFontSizeSlider" min="0.5" max="2.0" step="0.05" value="0.8" class="flex-1">
                            <button class="btn-icon-small slider-step-btn" data-target="textBlockFontSizeSlider" data-step="0.05"><ion-icon name="add-circle-outline"></ion-icon></button>
                            <span id="textBlockFontSizeValue" class="mono text-accent width-60">0.8em</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Action Text Font Size</label>
                        <div class="flex-row align-center gap-10">
                            <button class="btn-icon-small slider-step-btn" data-target="actionTextFontSizeSlider" data-step="-0.1"><ion-icon name="remove-circle-outline"></ion-icon></button>
                            <input type="range" id="actionTextFontSizeSlider" min="1.0" max="5.0" step="0.1" value="2.5" class="flex-1">
                            <button class="btn-icon-small slider-step-btn" data-target="actionTextFontSizeSlider" data-step="0.1"><ion-icon name="add-circle-outline"></ion-icon></button>
                            <span id="actionTextFontSizeValue" class="mono text-accent width-60">2.5rem</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Speech & UI Font</label>
                        <select id="styleLabFontSelect" class="glass-select">
                            <option value="">Default</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Action Text Font</label>
                        <select id="styleLabActionFontSelect" class="glass-select">
                            <option value="">Default</option>
                        </select>
                    </div>

                    <hr class="margin-y-20 border-dim">

                    <div class="form-group">
                        <h5 class="margin-b-10 text-accent">Narrator Styles</h5>
                        <div class="flex-row gap-10">
                            <div class="flex-1"><label class="font-size-07">BG</label><input type="color" id="narratorBgPicker" class="gov-color-input width-100"></div>
                            <div class="flex-1"><label class="font-size-07">Text</label><input type="color" id="narratorColorPicker" class="gov-color-input width-100"></div>
                            <div class="flex-1"><label class="font-size-07">Border</label><input type="color" id="narratorBorderPicker" class="gov-color-input width-100"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <h5 class="margin-b-10 text-accent">Internal Monologue Styles</h5>
                        <div class="flex-row gap-10">
                            <div class="flex-1"><label class="font-size-07">BG</label><input type="color" id="monologueBgPicker" class="gov-color-input width-100"></div>
                            <div class="flex-1"><label class="font-size-07">Text</label><input type="color" id="monologueColorPicker" class="gov-color-input width-100"></div>
                            <div class="flex-1"><label class="font-size-07">Border</label><input type="color" id="monologueBorderPicker" class="gov-color-input width-100"></div>
                            <div class="flex-1"><label class="font-size-07">Ben-Day</label><input type="color" id="monologueDotPicker" class="gov-color-input width-100"></div>
                        </div>
                    </div>

                    <hr class="margin-y-20 border-dim">

                    <div class="form-group">
                        <label>Custom CSS Files</label>
                        <div id="custom-css-list" class="margin-b-10 flex-column gap-5">
                            <!-- Injected filenames -->
                        </div>
                        <label class="glass glass-btn glass-btn--sm glass-btn--ghost text-center cursor-pointer">
                            + Upload CSS File
                            <input type="file" id="styleLabCssInput" accept=".css" class="hidden">
                        </label>
                    </div>

                    <div class="margin-t-30 flex-row gap-15">
                        <button id="saveStyleSettingsBtn" class="glass glass-btn glass-btn--primary flex-2">Save Styles</button>
                        <button id="resetStyleSettingsBtn" class="glass glass-btn glass-btn--sm glass-btn--ghost flex-1">Reset Defaults</button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Live Preview -->
            <div class="flex-1 glass glass--dark glass-card">
                <h4 class="margin-b-20 text-accent">Live Preview</h4>
                <div id="style-lab-preview" class="style-preview-stage page" style="position: relative; height: 500px; background: #fff; border: 1px solid #ccc; overflow: hidden; border-radius: 8px;">
                    <!-- Preview components will be injected here -->
                </div>
            </div>
        </div>
    </div>
