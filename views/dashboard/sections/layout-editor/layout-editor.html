    <div class="layout-editor dashboard-section hidden h-full glass glass--frosted glass-card">
        <div class="editor-header editor-header-flex">
            <h3>Visual Editor: <span id="editorPageTitle"></span></h3>
            <button id="closeEditorBtn" class="glass glass-btn glass-btn--sm glass-btn--ghost">Close &rarr;</button>
        </div>
        <div class="editor-container editor-container-flex">
            <div class="preview-pane preview-pane-flex"><iframe id="pagePreviewFrame" class="preview-iframe"></iframe></div>
            <div class="tools-pane tools-pane-flex">
                <h4>Visual Editor</h4>
                <p class="text-muted">Drag & Drop assets onto panels.</p>
                <div id="uploadStatus"></div>
            </div>
        </div>
    </div>

    <!-- Hidden template used for cloning the dialogue editor form -->
    <div id="sceneItemEditorTemplate" style="display: none;">
        <div id="sceneItemEditor" class="hidden">
            <form id="sceneItemForm">
                <div class="input-field"><label>ID</label><input type="text" id="prop-id" class="glass-input" readonly></div>
                <div class="input-field">
                    <label>Display Type</label>
                    <select id="prop-type" class="glass-select width-100">
                        <option value="SpeechBubble">Speech Bubble</option>
                        <option value="Narrator">TextBlock: Narrator</option>
                        <option value="InternalMonologue">TextBlock: Internal Monologue</option>
                        <option value="Dialogue">TextBlock: Dialogue</option>
                        <option value="ActionText">Action Text (Minimal)</option>
                        <option value="Pause">Pause</option>
                    </select>
                </div>
                <div class="input-field prop-group-character"><label>Character</label><input type="text" id="prop-character" class="glass-input"></div>
                <div class="input-field prop-group-text"><label>Dialogue</label><textarea id="prop-text" rows="4" class="glass-textarea"></textarea></div>
                <div class="props-group">
                    <h5>Placement</h5>
                    <div class="input-field"><label>Panel Selector</label><input type="text" id="prop-panel" class="glass-input" placeholder=".panel-A"></div>
                    <div class="input-field"><label>Top (%)</label><input type="text" id="prop-top" class="glass-input"></div>
                    <div class="input-field"><label>Left (%)</label><input type="text" id="prop-left" class="glass-input"></div>
                    <div class="input-field"><label>Right (%)</label><input type="text" id="prop-right" class="glass-input"></div>
                    <div class="input-field"><label>Bottom (%)</label><input type="text" id="prop-bottom" class="glass-input"></div>
                    <div class="input-field"><label>Width (%)</label><input type="text" id="prop-width" class="glass-input" placeholder="Auto"></div>

                    <div class="input-field">
                        <label>Tail Position</label>
                        <select id="prop-tail" class="glass-select width-100">
                            <option value="">None</option>
                            <option value="top-left">Top Left</option>
                            <option value="top-right">Top Right</option>
                            <option value="bottom-left">Bottom Left</option>
                            <option value="bottom-right">Bottom Right</option>
                        </select>
                    </div>
                    <div class="input-field"><label>Tail Skew</label><input type="number" id="prop-tail-skew" class="glass-input" placeholder="25"></div>
                    <div class="input-field"><label>Tail Scale</label><input type="text" id="prop-tail-scale" class="glass-input" placeholder="1.0"></div>
                    
                    <div class="input-field">
                        <label>Font Size</label>
                        <input type="text" id="prop-font-size" class="glass-input" placeholder="0.85rem">
                    </div>
                    <div class="input-field prop-group-font">
                        <label>Action Font</label>
                        <select id="prop-font-family" class="glass-select width-100">
                            <option value="">Default</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Text Color</label>
                        <input type="color" id="prop-action-color" value="#000000" class="gov-color-input">
                    </div>

                    <!-- AI Color Extraction Tool -->
                    <div class="palette-extraction-row flex-column gap-10 margin-b-15 glass glass--dark padding-10 border-radius-8">
                        <div class="flex-row align-center gap-10">
                            <select id="prop-palette-panel" class="glass-select flex-1" style="min-width: 120px;">
                                <option value="">-- Select Panel --</option>
                            </select>
                            <button type="button" id="prop-gen-palette" class="glass glass-btn glass-btn--sm glass-btn--primary flex-row align-center gap-5" style="white-space: nowrap;">
                                <ion-icon name="color-palette-outline"></ion-icon>
                                <span>Extract Palette</span>
                            </button>
                        </div>
                        <div id="prop-palette-swatches" class="flex-row gap-5 flex-wrap hidden">
                            <!-- Swatches injected here -->
                        </div>
                    </div>

                    <div class="input-field" style="display:flex; flex-direction:row; align-items:center; gap:8px; margin-bottom: 15px;">
                        <input type="checkbox" id="prop-outline-enabled" style="margin:0;">
                        <label style="margin:0;">Text Outline</label>
                    </div>
                    <div class="input-field">
                        <label>Outline Color</label>
                        <input type="color" id="prop-outline-color" value="#000000" class="gov-color-input">
                    </div>
                    <div class="input-field">
                        <label>Thickness (px)</label>
                        <input type="number" step="0.1" id="prop-outline-size" class="glass-input" placeholder="1.0">
                    </div>

                    <div class="prop-group-curve">
                        <div class="input-field"><label>SVG Curve Path</label><input type="text" id="prop-curve" class="glass-input" placeholder="M 10,90 Q 150,10 290,90"></div>
                        <div class="input-field"><label>Curve W</label><input type="number" id="prop-curve-w" class="glass-input" placeholder="300"></div>
                        <div class="input-field"><label>Curve H</label><input type="number" id="prop-curve-h" class="glass-input" placeholder="100"></div>
                        <div class="input-field"><label>Rotation</label><input type="number" step="0.1" id="prop-rotation" class="glass-input" placeholder="-20"></div>
                    </div>
                </div>
                
                <div class="prop-group-duration hidden"><div class="input-field"><label>Duration (ms)</label><input type="number" id="prop-duration" class="glass-input"></div></div>
                <button type="button" id="deleteItemBtn" class="glass glass-btn glass-btn--sm glass-btn--danger delete-item-btn">Delete Item</button>
            </form>
        </div>
        <div id="sceneItemPlaceholder" class="item-placeholder text-muted italic">Select an item to edit.</div>
    </div>

    <div id="fileBrowserModal" class="glass-modal-backdrop" style="top: 80px;">
        <div class="glass-modal" style="width: 90vw; max-width: 1200px; height: 85vh; display: flex; flex-direction: column;">
            <div class="glass-modal__header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <h3 class="props-header" style="margin: 0;">Select Asset</h3>
                <button id="closeFileBrowserBtn" class="glass-modal__close" aria-label="Close modal">×</button>
            </div>
            <div class="modal-toolbar padding-10 glass glass--dark modal-toolbar-flex" style="display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border);">
                 <select id="fbScopeSelect" class="glass-select">
                    <option value="page">Page Assets</option>
                    <option value="volume">Volume Assets</option>
                    <option value="series">Series Assets</option>
                 </select>
                 <input type="text" id="fbSearchInput" placeholder="Search..." class="flex-1 gov-input">
                 <select id="fbSortSelect" class="glass-select">
                    <option value="date">Newest First</option>
                    <option value="name">Name (A-Z)</option>
                 </select>
                 <div class="divider-v margin-b-0"></div>
                 <label class="glass glass-btn glass-btn--sm glass-btn--ghost" style="cursor: pointer;">
                    Upload New
                    <input type="file" id="fileBrowserUploadInput" class="hidden" style="display: none;">
                 </label>
                 <span id="fileBrowserStatus" class="text-muted font-size-09 align-self-center"></span>
            </div>
            <div class="glass-modal__body" style="padding: 0; display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <div id="fileBrowserGrid" class="flex-1 padding-20 file-browser-grid" style="overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <div id="savingOverlay" class="saving-overlay">
        <div class="loader-spinner"></div>
        <h3>Saving Data...</h3>
    </div>
