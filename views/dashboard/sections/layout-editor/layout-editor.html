    <div class="layout-editor dashboard-section hidden h-full glass glass--frosted glass-card">
        <div class="editor-header editor-header-flex">
            <div class="pb-context-nav flex-1">
                <div id="editorPageTabs" class="page-tabs" aria-label="Open pages"></div>
                <div id="editorPagePicker" class="pb-nav-popover glass glass--dark glass-card hidden"></div>
            </div>
            <div id="editorAnnotations" class="glass-annotations"></div>
            <button id="closeEditorBtn" class="glass glass-btn glass-btn--sm glass-btn--ghost">Close &rarr;</button>
        </div>
        <div class="editor-container editor-container-flex">
            <nav id="editorToolbar" class="pb-toolbar" aria-label="Editor tools">
                <button type="button" class="pb-tool" data-mode="layout" title="Page Layout"
                    aria-label="Page Layout" disabled>
                    <ion-icon name="grid-outline"></ion-icon>
                </button>
                <button type="button" class="pb-tool is-active" data-mode="panels" title="Panels"
                    aria-label="Panels" disabled>
                    <ion-icon name="images-outline"></ion-icon>
                </button>
                <button type="button" class="pb-tool" data-mode="timeline" title="Timeline"
                    aria-label="Timeline" disabled>
                    <ion-icon name="list-outline"></ion-icon>
                </button>
            </nav>
            <div class="preview-pane preview-pane-flex">
                <div id="editorEmptyState" class="pb-empty-state">
                    <ion-icon name="albums-outline"></ion-icon>
                    <p class="text-muted">No page open.</p>
                    <button type="button" id="editorEmptyOpenBtn"
                        class="glass glass-btn glass-btn--primary">Open a Page</button>
                </div>
                <iframe id="pagePreviewFrame" class="preview-iframe hidden"></iframe>
            </div>
            <div class="tools-pane tools-pane-flex">
                <h4>Editor</h4>
                <p class="text-muted">Drag & Drop assets onto panels.</p>

                <div id="uploadStatus"></div>
            </div>
        </div>
    </div>



    <div id="fileBrowserModal" class="glass-modal-backdrop" style="top: 80px;">
        <div class="glass-modal" style="width: 90vw; max-width: 1200px; height: 85vh; display: flex; flex-direction: column;">
            <div class="glass-modal__header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                <h3 class="props-header" style="margin: 0;">Select Asset</h3>
                <button id="closeFileBrowserBtn" class="glass-modal__close" aria-label="Close modal">×</button>
            </div>
            <div class="modal-toolbar padding-10 glass glass--dark modal-toolbar-flex" style="display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border);">
                 <select id="fbScopeSelect" class="glass-select">
                    <option value="page">Page Assets</option>
                    <option value="volume">Volume Assets</option>
                    <option value="series">Series Assets</option>
                 </select>
                 <input type="text" id="fbSearchInput" placeholder="Search..." class="flex-1 gov-input">
                 <select id="fbSortSelect" class="glass-select">
                    <option value="date">Newest First</option>
                    <option value="name">Name (A-Z)</option>
                 </select>
                 <div class="divider-v margin-b-0"></div>
                 <label class="glass glass-btn glass-btn--sm glass-btn--ghost" style="cursor: pointer;">
                    Upload New
                    <input type="file" id="fileBrowserUploadInput" class="hidden" style="display: none;">
                 </label>
                 <span id="fileBrowserStatus" class="text-muted font-size-09 align-self-center"></span>
            </div>
            <div class="glass-modal__body" style="padding: 0; display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <div id="fileBrowserGrid" class="flex-1 padding-20 file-browser-grid" style="overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <div id="savingOverlay" class="saving-overlay">
        <div class="loader-spinner"></div>
        <h3>Saving Data...</h3>
    </div>
