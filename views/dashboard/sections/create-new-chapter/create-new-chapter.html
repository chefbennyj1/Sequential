    <div class="create-new-chapter dashboard-section hidden glass glass--frosted glass-card">
        <h3>Create New Chapter</h3>
        <p class="text-muted margin-b-20">This will create the next chapter folder and the first page within it.</p>
        <form id="chapter-info">
            <div class="form-group">
                <label>Select Series</label>
                <select id="chapterSeriesSelect"></select>
            </div>
            <div class="form-group">
                <label>Select Volume</label>
                <select id="chapterVolumeSelect" disabled><option value="">Select a Series first</option></select>
            </div>
            <div class="input-field">
                <label for="chapterIndex">Chapter Index (Number)</label>
                <input type="number" id="chapterIndex" name="chapterIndex" placeholder="e.g. 3" required />
            </div>
            <div class="input-field">
                <label for="chapterTitle">Chapter Title</label>
                <input type="text" id="chapterTitle" name="title" placeholder="e.g. The Neon Rain" />
            </div>
            <button class="glass glass-btn glass-btn--primary width-100" type="submit" id="createChapterBtn">Initialize Chapter</button>
        </form>
        <div id="chapterStatus" class="builder-status"></div>
    </div>
