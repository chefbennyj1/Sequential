<div class="library-root">
    <div class="library-header">
        <h1 id="library-logo">MY COLLECTION</h1>
        <p class="text-muted">Select a series to begin reading.</p>
    </div>

    <div class="library-grid-container">
        <div class="library-grid" id="libraryGrid">
            <!-- Library Items Injected Here -->
        </div>
    </div>
    
    <!-- Template for a Library Item -->
    <template id="library-item-template">
        <div class="library-card">
            <div class="card-shadow-wrapper">
                <div class="card-content-container">
                    <div class="card-image-wrapper">
                        <!-- Cover Image (Static) -->
                        <img class="cover-image" src="" alt="Cover" />
                    </div>
                    
                    <div class="card-overlay">
                        <div class="card-info-top">
                            <h2 class="series-title">TITLE</h2>
                        </div>
                        
                        <div class="card-info-bottom">
                            <p class="series-description"></p>
                            <a href="#" class="btn read-now-btn">READ NOW</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
