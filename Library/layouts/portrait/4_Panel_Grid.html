<style>
@import url('/layouts/styles/base-comic-layout-4-panel-grid.css');

/* 
    Layout: Four Panel Grid (Portrait 2x2 Version)
    Two on top, two on bottom.
*/
.page-layout.layout-4-panel-grid {  
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Row 1 */
.layout-4-panel-grid .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-4-panel-grid .panel-B { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-4-panel-grid .panel-C { 
    grid-column: 1 / 2;
    grid-row: 2 / 3; 
}
.layout-4-panel-grid .panel-D { 
    grid-column: 2 / 3; 
    grid-row: 2 / 3; 
}
</style>
<div class="section-container portrait-page page-layout layout-4-panel-grid">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
