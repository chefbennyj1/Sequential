<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Kinetic Slant 2x3 (Portrait)
    - Row 1: Slanted split between 1a and 1b (10px gap)
    - Row 2: Three panels across (1c, 1d, 1e)
*/
.page-layout.layout-kinetic-slant-2x3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr; /* 3 Columns for the bottom row */
    grid-template-rows: 1fr 1.3fr;      /* Made bottom row (Row 2) taller */
    gap: 10px;
}

/* Slanted Row 1 */
.layout-kinetic-slant-2x3 .panel-1a {
    grid-column: 1 / 3; /* Spans Col 1 & 2 (0% to 66.6% total) */
    grid-row: 1 / 2;
    /* Split line: Top @ 52.8% total, Bottom @ 33% total */
    /* Internal coords: Top Right: 52.8/66.6 = 79.2%, Bottom Right: 33/66.6 = 49.5% */
    clip-path: polygon(0 0, 79.2% 0, 49.5% 100%, 0 100%);
    /* Mimic the 4px black border using drop-shadow (standard borders fail on clip-path) */
    filter: drop-shadow(4px 0 0 black) drop-shadow(-4px 0 0 black) drop-shadow(0 4px 0 black) drop-shadow(0 -4px 0 black);
    z-index: 2;
    border: none; /* Disable standard border which looks broken with clip-path */
}

.layout-kinetic-slant-2x3 .panel-1b {
    grid-column: 2 / 4; /* Spans Col 2 & 3 (33.3% to 100% total) */
    grid-row: 1 / 2;
    /* Split line: Top @ 54.1% total, Bottom @ 34.3% total */
    /* Internal coords: Top Left: (54.1-33.3)/66.6 = 31.2%, Bottom Left: (34.3-33.3)/66.6 = 1.5% */
    clip-path: polygon(31.2% 0, 100% 0, 100% 100%, 1.5% 100%);
    /* Mimic the 4px black border using drop-shadow */
    filter: drop-shadow(4px 0 0 black) drop-shadow(-4px 0 0 black) drop-shadow(0 4px 0 black) drop-shadow(0 -4px 0 black);
    z-index: 1;
    border: none;
}

/* Row 2: Three Panels Across */
.layout-kinetic-slant-2x3 .panel-1c {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-kinetic-slant-2x3 .panel-1d {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}
.layout-kinetic-slant-2x3 .panel-1e {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}
</style>
<div class="section-container portrait-page page-layout layout-kinetic-slant-2x3">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-1d"></div>
    <div class="panel panel-1e"></div>
</div>
