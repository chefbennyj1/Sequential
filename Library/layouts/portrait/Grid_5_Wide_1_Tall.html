<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5 Wide, 1 Tall (Portrait)
    Fix: Added grid-template-rows to prevent overlap and ensured panels sit in correct cells.
    - Row 1: panel-A (Banner)
    - Row 2: panel-B (Left), panel-D (Right Tall - starts)
    - Row 3: panel-C (Left), panel-D (Right Tall - ends)
    - Row 4: panel-E (Banner)
*/
.page-layout.layout-5-wide-1-tall {
    display: grid;
    grid-template-columns: 3fr 2fr; 
    grid-template-rows: auto 1fr 1fr auto; /* Explicit rows */
    gap: 10px;
    padding-bottom: 20px;
    height: 94vh; /* Constraint to viewport */
}

.layout-5-wide-1-tall .panel {
    width: 100%;
    height: 100%;
}

.layout-5-wide-1-tall .panel-A {
    grid-column: 1 / 3;
    grid-row: 1;
    aspect-ratio: 21 / 9; 
}

.layout-5-wide-1-tall .panel-B {
    grid-column: 1 / 2;
    grid-row: 2;
}

.layout-5-wide-1-tall .panel-C {
    grid-column: 1 / 2;
    grid-row: 3;
}

.layout-5-wide-1-tall .panel-D {
    grid-column: 2 / 3;
    grid-row: 2 / 4; /* Spans row 2 and 3 */
}

.layout-5-wide-1-tall .panel-E {
    grid-column: 1 / 3;
    grid-row: 4;
    aspect-ratio: 21 / 9; 
}
</style>
<div class="section-container portrait-page page-layout layout-5-wide-1-tall">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
