<style>
@import url('/layouts/styles/base-comic-layout.css');

/*
    Layout: 4-Panel Staggered Angled Split (Portrait)

    Same construction as 4_Panel_Vertical_Angled_Split.html - read the METHOD,
    THE GUTTER, THE PANEL FRAME and THE PAGE MARGIN notes in that file before
    editing this one. Only the cuts differ.

    Where that layout crosses two full-width cuts at dead centre, this one
    breaks the vertical cut into two segments that meet H at different points,
    so there is no four-way junction and the page reads asymmetrically:

        H         page (0,44) -> (100,56)     one straight cut, full width
        V_top     page (62,0) -> (50,50)      meets H at x=50
        V_bottom  page (25,47) -> (16,100)    meets H at x=25

    The 25-unit jump is the stagger. Between x=25 and x=50 along H, panel A
    faces panel D directly with no vertical cut between them.

    Panel rhythm: A wide establishing top-left, B a tall right column, C a
    narrow bottom-left sliver, D a wide bottom.

    Panel  Page corners                             Box (l, t, w, h)
    A      (0,0)   (62,0)   (50,50)  (0,44)         0,  0,  62, 50
    B      (62,0)  (100,0)  (100,56) (50,50)        50, 0,  50, 56
    C      (0,44)  (25,47)  (16,100) (0,100)        0,  44, 25, 56
    D      (25,47) (100,56) (100,100)(16,100)       16, 47, 84, 53

    Shift directions: A and B sit above H (up), C and D below (down). A is left
    of V_top (left), B right of it (right). C is left of V_bottom (left), D
    right of it (right). Corners on both a cut and H shift on both axes.
*/

.page-layout.layout-staggered-angled-split-4-panel {
    display: block;
    position: relative;
    gap: 0;
    padding: 0;
    overflow: hidden;
    --cut: 5px;
    --edge: 4px;
    /*
        Border slope correction, applied where a cut meets a page edge - see the
        same note in 4_Panel_Vertical_Angled_Split.html. One value per cut,
        each |cut slope| * --edge in px on the 6.625:10.25 content box:
            H         rises 12% of page height across its width -> 0.1879 -> 0.75px
            V_top     runs   12% of page width  over  50% height -> 0.1533 -> 0.61px
            V_bottom  runs    9% of page width  over  53% height -> 0.1085 -> 0.43px
        Both V segments lean LEFT going down (x decreases as y increases), the
        opposite of the sibling layout, so their signs are reversed from it.
    */
    --skewH: 0.75px;
    --skewVt: 0.61px;
    --skewVb: 0.43px;
}

/* White page margin. Border, not padding - see the sibling layout's notes. */
.section-container.page.page-layout.layout-staggered-angled-split-4-panel {
    border: var(--panel-padding, 10px) solid #fff;
}

/* No drop shadow: clip-path is applied after filter, so one cannot be cast
   from the panel itself. See the sibling layout and Agents.md. */
.layout-staggered-angled-split-4-panel .panel {
    position: absolute;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

/* Wide establishing panel, top left */
.layout-staggered-angled-split-4-panel .panel-A {
    left: 0;
    top: 0;
    width: 62%;
    height: 50%;
    clip-path: polygon(
        0 0,
        calc(100% - var(--cut)) 0,
        calc(80.645% - var(--cut)) calc(100% - var(--cut)),
        0 calc(88% - var(--cut))
    );
}

.layout-staggered-angled-split-4-panel .panel-A > * {
    clip-path: polygon(
        var(--edge) var(--edge),
        calc(100% - var(--cut) - var(--edge) - var(--skewVt)) var(--edge),
        calc(80.645% - var(--cut) - var(--edge)) calc(100% - var(--cut) - var(--edge)),
        var(--edge) calc(88% - var(--cut) - var(--edge) + var(--skewH))
    );
}

/* Tall right column */
.layout-staggered-angled-split-4-panel .panel-B {
    left: 50%;
    top: 0;
    width: 50%;
    height: 56%;
    clip-path: polygon(
        calc(24% + var(--cut)) 0,
        100% 0,
        100% calc(100% - var(--cut)),
        var(--cut) calc(89.286% - var(--cut))
    );
}

.layout-staggered-angled-split-4-panel .panel-B > * {
    clip-path: polygon(
        calc(24% + var(--cut) + var(--edge) - var(--skewVt)) var(--edge),
        calc(100% - var(--edge)) var(--edge),
        calc(100% - var(--edge)) calc(100% - var(--cut) - var(--edge) - var(--skewH)),
        calc(var(--cut) + var(--edge)) calc(89.286% - var(--cut) - var(--edge))
    );
}

/* Narrow sliver, bottom left */
.layout-staggered-angled-split-4-panel .panel-C {
    left: 0;
    top: 44%;
    width: 25%;
    height: 56%;
    clip-path: polygon(
        0 var(--cut),
        calc(100% - var(--cut)) calc(5.357% + var(--cut)),
        calc(64% - var(--cut)) 100%,
        0 100%
    );
}

.layout-staggered-angled-split-4-panel .panel-C > * {
    clip-path: polygon(
        var(--edge) calc(var(--cut) + var(--edge) + var(--skewH)),
        calc(100% - var(--cut) - var(--edge)) calc(5.357% + var(--cut) + var(--edge)),
        calc(64% - var(--cut) - var(--edge) + var(--skewVb)) calc(100% - var(--edge)),
        var(--edge) calc(100% - var(--edge))
    );
}

/* Wide bottom */
.layout-staggered-angled-split-4-panel .panel-D {
    left: 16%;
    top: 47%;
    width: 84%;
    height: 53%;
    clip-path: polygon(
        calc(10.714% + var(--cut)) var(--cut),
        100% calc(16.981% + var(--cut)),
        100% 100%,
        var(--cut) 100%
    );
}

.layout-staggered-angled-split-4-panel .panel-D > * {
    clip-path: polygon(
        calc(10.714% + var(--cut) + var(--edge)) calc(var(--cut) + var(--edge)),
        calc(100% - var(--edge)) calc(16.981% + var(--cut) + var(--edge) - var(--skewH)),
        calc(100% - var(--edge)) calc(100% - var(--edge)),
        calc(var(--cut) + var(--edge) + var(--skewVb)) calc(100% - var(--edge))
    );
}
</style>
<div class="section-container page page-layout layout-staggered-angled-split-4-panel">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
