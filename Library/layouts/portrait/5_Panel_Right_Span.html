<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 5 Panel Right Span (Portrait)
    Refactored from: Grid Right Span Split Stack V2

    - Row 1: panel-A (Full width)
    - Row 2: panel-B (Full width)
    - Row 3 & 4 (Left): panel-D and panel-E stacked.
    - Row 3 & 4 (Right): panel-C spanning both rows.
*/
.page-layout.layout-5-panel-right-span {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    grid-template-rows: 1fr 1fr 0.9fr 0.9fr;
    gap: 10px;
}

/* --- Row 1 (Full Width) --- */
.layout-5-panel-right-span .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

/* --- Row 2 (Full Width) --- */
.layout-5-panel-right-span .panel-B {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}

/* --- Row 3 & 4 (Left Stack) --- */
.layout-5-panel-right-span .panel-D {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-5-panel-right-span .panel-E {
    grid-column: 1 / 2;
    grid-row: 4 / 5;
}

/* --- Row 3 & 4 (Right Span) --- */
.layout-5-panel-right-span .panel-C {
    grid-column: 2 / 3;
    grid-row: 3 / 5; /* Spans Row 3 and 4 */
}
</style>

<div class="section-container page page-layout layout-5-panel-right-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-C"></div>
</div>
