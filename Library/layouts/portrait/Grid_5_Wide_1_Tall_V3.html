<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5 Wide, 1 Tall V3 (Portrait)
    Fix: Swapped 1a and 2a positions from the V1 layout.
    - Row 1: panel-D (Banner)
    - Row 2: panel-B (Left), panel-A (Right Tall - starts)
    - Row 3: panel-C (Left), panel-A (Right Tall - ends)
    - Row 4: panel-E (Banner)
*/
.page-layout.layout-5-wide-1-tall-v3 {
    display: grid;
    grid-template-columns: 3fr 2fr; 
    grid-template-rows: auto 1fr 1fr auto; 
    gap: 10px;
    padding-bottom: 20px;
    height: 94vh; 
}

.layout-5-wide-1-tall-v3 .panel {
    width: 100%;
    height: 100%;
}

.layout-5-wide-1-tall-v3 .panel-D {
    grid-column: 1 / 3;
    grid-row: 1;
    aspect-ratio: 21 / 9; 
}

.layout-5-wide-1-tall-v3 .panel-B {
    grid-column: 1 / 2;
    grid-row: 2;
}

.layout-5-wide-1-tall-v3 .panel-C {
    grid-column: 1 / 2;
    grid-row: 3;
}

.layout-5-wide-1-tall-v3 .panel-A {
    grid-column: 2 / 3;
    grid-row: 2 / 4; 
}

.layout-5-wide-1-tall-v3 .panel-E {
    grid-column: 1 / 3;
    grid-row: 4;
    aspect-ratio: 21 / 9; 
}
</style>
<div class="section-container portrait-page page-layout layout-5-wide-1-tall-v3">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
