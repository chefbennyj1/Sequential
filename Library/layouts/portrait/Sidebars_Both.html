<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Sidebars Both (Portrait Version)
    Redesigned into 4 rows, 2 columns.
    Top Half:
    - Col 1: 1a (Spans Rows 1 & 2)
    - Col 2: 1b (Row 1), 1c (Row 2)
    Bottom Half:
    - Col 1: 2a (Row 3), 2b (Row 4)
    - Col 2: 1d (Spans Rows 3 & 4)
*/
.page-layout.layout-asymmetrical-with-left-sidebar-right-sidebar {  
    display: grid;
    /* 2 Columns */
    grid-template-columns: 1fr 1fr;
    /* 4 Rows */
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
}

/* --- Top Half --- */
.layout-asymmetrical-with-left-sidebar-right-sidebar .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}
.layout-asymmetrical-with-left-sidebar-right-sidebar .panel-B { 
    grid-column: 2 / 3;
    grid-row: 1 / 2; 
}
.layout-asymmetrical-with-left-sidebar-right-sidebar .panel-C { 
    grid-column: 2 / 3;
    grid-row: 2 / 3; 
}

/* --- Bottom Half --- */
.layout-asymmetrical-with-left-sidebar-right-sidebar .panel-E { 
    grid-column: 1 / 2; 
    grid-row: 3 / 4; 
}
.layout-asymmetrical-with-left-sidebar-right-sidebar .panel-F { 
    grid-column: 1 / 2; 
    grid-row: 4 / 5; 
}
/* Assuming you meant 1d here for the final bottom right panel! */
.layout-asymmetrical-with-left-sidebar-right-sidebar .panel-D {  
    grid-column: 2 / 3; 
    grid-row: 3 / 5; /* Spans Row 3 and 4 */
} 
</style>
<div class="section-container page page-layout layout-asymmetrical-with-left-sidebar-right-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
