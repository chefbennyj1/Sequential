<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Four Panel Grid with Left Side Span Stacked Swap (Portrait)
    Redesigned as:
    Row 1: 1a (Full Width)
    Row 2: 2a, 1c (Split)
    Row 3: 1b, 2b (Split)
*/
.page-layout.layout-four-panel-grid-left-span-stacked-swap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1.2fr 1fr 1fr;
    gap: 10px;
}

.layout-four-panel-grid-left-span-stacked-swap .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

.layout-four-panel-grid-left-span-stacked-swap .panel-D {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-four-panel-grid-left-span-stacked-swap .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

.layout-four-panel-grid-left-span-stacked-swap .panel-B {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-four-panel-grid-left-span-stacked-swap .panel-E {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}
</style>
<div class="section-container portrait-page page-layout layout-four-panel-grid-left-span-stacked-swap">
    <div class="panel panel-A"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-E"></div>
</div>
