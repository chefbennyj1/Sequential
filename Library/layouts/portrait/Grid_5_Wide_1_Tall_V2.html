<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5 Wide, 1 Tall V2 (Portrait)
    Fix: Reverted to high-end cinematic stacked logic.
    - Row 1: panel-A (Banner)
    - Row 2: panel-B (Banner)
    - Row 3: panel-C (Banner)
    - Row 4: panel-D (Tall side focus - starts)
    - Row 5: panel-E (Banner - sits next to 2a)
*/
.page-layout.layout-5-wide-1-tall-v2 {
    display: grid;
    grid-template-columns: 2fr 1fr; /* 2/3 width for banners, 1/3 for tall */
    grid-template-rows: auto auto auto 1fr;
    gap: 10px;
    padding-bottom: 20px;
    height: 94vh;
}

.layout-5-wide-1-tall-v2 .panel {
    width: 100%;
    height: 100%;
}

.layout-5-wide-1-tall-v2 .panel-A {
    grid-column: 1 / 3;
    grid-row: 1;
    aspect-ratio: 21 / 9; 
}

.layout-5-wide-1-tall-v2 .panel-B {
    grid-column: 1 / 3;
    grid-row: 2;
    aspect-ratio: 21 / 9;
}

.layout-5-wide-1-tall-v2 .panel-C {
    grid-column: 1 / 3;
    grid-row: 3;
    aspect-ratio: 21 / 9;
}

.layout-5-wide-1-tall-v2 .panel-D {
    grid-column: 2 / 3;
    grid-row: 4;
}

.layout-5-wide-1-tall-v2 .panel-E {
    grid-column: 1 / 2;
    grid-row: 4;
}
</style>
<div class="section-container portrait-page page-layout layout-5-wide-1-tall-v2">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-D"></div>
</div>
