<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 4-Panel Full Left Sidebar (Portrait)
    - Column 1: Panel A (Tall focus sidebar spanning all 3 rows)
    - Column 2: Panel B (Top), Panel C (Middle), Panel D (Bottom)
*/
.page-layout.layout-4-panel-full-left-sidebar {
    display: grid;
    grid-template-columns: 2.45fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

.layout-4-panel-full-left-sidebar .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 4; /* Spans all three rows */
}

.layout-4-panel-full-left-sidebar .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

.layout-4-panel-full-left-sidebar .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

.layout-4-panel-full-left-sidebar .panel-D {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container page page-layout layout-4-panel-full-left-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
