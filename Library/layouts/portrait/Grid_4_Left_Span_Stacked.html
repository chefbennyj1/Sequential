<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Four Panel Grid with Left Side Span (Stacked Variation)
    - Left Span: 1a (Spans Rows 1 & 2)
    - Right Stack: 1b (Row 1), 1c (Row 2)
    - Bottom Row 3: 2a (Full Width)
    - Bottom Row 4: 2b (Full Width)
*/
.page-layout.layout-four-panel-grid-with-left-side-span-stacked {
    display: grid;
    /* 2 Columns */
    grid-template-columns: 1fr 1fr;
    /* 4 Rows */
    grid-template-rows: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

/* --- Top Section --- */
/* Left Span */
.layout-four-panel-grid-with-left-side-span-stacked .panel-1a {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}

/* Right Stack */
.layout-four-panel-grid-with-left-side-span-stacked .panel-1b {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-four-panel-grid-with-left-side-span-stacked .panel-1c {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* --- Bottom Stacked Rows --- */
.layout-four-panel-grid-with-left-side-span-stacked .panel-2a {
    grid-column: 1 / 3; /* Spans both columns */
    grid-row: 3 / 4;
}
.layout-four-panel-grid-with-left-side-span-stacked .panel-2b {
    grid-column: 1 / 3; /* Spans both columns */
    grid-row: 4 / 5;
}
</style>
<div class="section-container portrait-page page-layout layout-four-panel-grid-with-left-side-span-stacked">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
