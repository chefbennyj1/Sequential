<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Side Panels (Portrait Version)
    Redesigned into 3 rows:
    Row 1: 1a, 1b, 1c (3 panels side-by-side)
    Row 2: 2a (Full width middle)
    Row 3: 1d (Full width bottom)
*/
.page-layout.layout-left-side-panel-right-side-panel {  
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 Columns for the top row */
    grid-template-rows: 1.5fr 1fr 1fr; /* Top row taller, middle and bottom normal */
    gap: 10px;
}

/* Row 1 (1a, 1b, 1c) */
.layout-left-side-panel-right-side-panel .panel-1a { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-left-side-panel-right-side-panel .panel-1b { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2; 
}
.layout-left-side-panel-right-side-panel .panel-1c {
    grid-column: 3 / 4;
    grid-row: 1 / 2;  
}

/* Row 2 (2a Full Width) */
.layout-left-side-panel-right-side-panel .panel-2a { 
    grid-column: 1 / 4; 
    grid-row: 2 / 3; 
} 

/* Row 3 (1d Full Width - Assuming you meant 1d here for the bottom!) */
.layout-left-side-panel-right-side-panel .panel-1d {
    grid-column: 1 / 4;
    grid-row: 3 / 4;  
}

</style>
<div class="section-container portrait-page page-layout layout-left-side-panel-right-side-panel">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-1d"></div>
    <div class="panel panel-2a"></div>
</div>
