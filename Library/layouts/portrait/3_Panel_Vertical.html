<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 3 Panel Vertical (Portrait)
    Fix: Added height and explicit columns.
    Structure: Three even vertical columns.
*/
.page-layout.layout-3-panel-vertical {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr;
    gap: 10px;
    height: 94vh; /* Constraint to viewport height */
    width: 100%;
}

.layout-3-panel-vertical .panel {
    height: 100%;
    width: 100%;
}

.layout-3-panel-vertical .panel-A { grid-column: 1; }
.layout-3-panel-vertical .panel-B { grid-column: 2; }
.layout-3-panel-vertical .panel-C { grid-column: 3; }

</style>
<div class="section-container page page-layout layout-3-panel-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
