<style>
@import url('/layouts/styles/base-comic-layout-3-panel-vertical.css');

/* 
    Layout: 3 Vertical Columns 9x16 (Portrait Version)
    Redesigned into 2 rows:
    Row 1: panel-A (Full width)
    Row 2: panel-B, panel-C (Side-by-side)
*/
.page-layout.layout-3-panel-vertical {
    display: grid;
    /* 2 Columns */
    grid-template-columns: 1fr 1fr;
    /* 2 Rows */
    grid-template-rows: 1.2fr 1fr;
    gap: 10px;
}

/* Row 1: Top Banner */
.layout-3-panel-vertical .panel-A { 
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

/* Row 2: Bottom Split */
.layout-3-panel-vertical .panel-B { 
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-3-panel-vertical .panel-C { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}
</style>
<div class="section-container portrait-page page-layout layout-3-panel-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
