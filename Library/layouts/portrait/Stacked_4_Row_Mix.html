<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Stacked 4 Row Mix (Portrait)
    - Row 1: panel-A (Full width)
    - Row 2: panel-B (Full width)
    - Row 3: panel-C and panel-D (Split 1:1)
    - Row 4: panel-E (Full width)
*/
.page-layout.layout-stacked-4-row-mix {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

.layout-stacked-4-row-mix .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

.layout-stacked-4-row-mix .panel-B {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}

.layout-stacked-4-row-mix .panel-C {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}

.layout-stacked-4-row-mix .panel-D {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}

.layout-stacked-4-row-mix .panel-E {
    grid-column: 1 / 3;
    grid-row: 4 / 5;
}
</style>
<div class="section-container page page-layout layout-stacked-4-row-mix">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
