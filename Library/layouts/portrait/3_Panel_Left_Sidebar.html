<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 3-Panel Left Sidebar (Portrait)
    - Col 1: Panel A (Tall focus sidebar)
    - Col 2: Panel B (Top), Panel C (Bottom)
*/
.page-layout.layout-3-panel-left-sidebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

.layout-3-panel-left-sidebar .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans both rows */
}

.layout-3-panel-left-sidebar .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

.layout-3-panel-left-sidebar .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}
</style>

<div class="section-container portrait-page page-layout layout-3-panel-left-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
