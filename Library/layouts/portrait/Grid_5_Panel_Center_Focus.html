<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5-Panel Center Focus (Portrait Version)
    
    Redesigned to prevent overflowing the viewport:
    Row 1: 1a (Left), 1b (Right, spans Row 1 & 2)
    Row 2: 2a (Left)
    Row 3: 1c (Left), 2b (Right)
*/
.page-layout.layout-five-panel-center-focus {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 1fr 1fr; /* 3 Rows */
    gap: 10px;
}

/* Left side top cluster */
.layout-five-panel-center-focus .panel-1a {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-five-panel-center-focus .panel-2a {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Right side tall focus */
.layout-five-panel-center-focus .panel-1b {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
}

/* Bottom Row */
.layout-five-panel-center-focus .panel-1c {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-five-panel-center-focus .panel-2b {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}

</style>
<div class="section-container portrait-page page-layout layout-five-panel-center-focus">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2b"></div>
</div>
