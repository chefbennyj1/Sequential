<style>
@import url('/layouts/styles/base-comic-layout-4-panel-2-left-span.css');

/* 
    Layout: Mixed Two Tall One Stack (Portrait Version)
    
    - Row 1: panel-A and panel-B (Side-by-side, Split 1:1)
    - Row 2: panel-C (Full Width)
    - Row 3: panel-D (Full Width)
*/
.page-layout.layout-4-panel-2-left-span {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Make the top row much taller to force the 9:16 aspect ratio */
    grid-template-rows: 2fr 1fr 1fr;
    gap: 10px;
}

/* --- Top Row: Side-by-Side --- */
.layout-4-panel-2-left-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-4-panel-2-left-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* --- Bottom Rows: Stacked --- */
.layout-4-panel-2-left-span .panel-C {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}
.layout-4-panel-2-left-span .panel-D {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-4-panel-2-left-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
