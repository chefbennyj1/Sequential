<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Multi Column Strips (Portrait Version)
    Redesigned into 3 rows:
    Row 1: 1a (Full width banner)
    Row 2: 1b, 1c, 1d, 1e (Four columns)
    Row 3: 2a, 2b (Two columns)
*/
.page-layout.layout-multi-column-strips {  
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr 1.2fr;
    gap: 10px;
}

/* Row 1 (1a spans everything) */
.layout-multi-column-strips .panel-1a { 
    grid-column: 1 / 5;
    grid-row: 1 / 2;
}

/* Row 2 (The 4 tiny ones) */
.layout-multi-column-strips .panel-1b { 
    grid-column: 1 / 2; 
    grid-row: 2 / 3; 
}
.layout-multi-column-strips .panel-1c {
    grid-column: 2 / 3;
    grid-row: 2 / 3;  
}
.layout-multi-column-strips .panel-1d {
    grid-column: 3 / 4;
    grid-row: 2 / 3;  
}
.layout-multi-column-strips .panel-1e {
    grid-column: 4 / 5;
    grid-row: 2 / 3;  
}

/* Row 3 (Split reveal) */
.layout-multi-column-strips .panel-2a { 
    grid-column: 1 / 3; 
    grid-row: 3 / 4; 
} 
.layout-multi-column-strips .panel-2b { 
    grid-column: 3 / 5; 
    grid-row: 3 / 4; 
}
</style>
<div class="section-container portrait-page page-layout layout-multi-column-strips">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-1d"></div>
    <div class="panel panel-1e"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
