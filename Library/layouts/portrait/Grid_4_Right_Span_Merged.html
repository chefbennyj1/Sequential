<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid 4 Right Span (Merged Bottom) (Portrait Version)
    
    - Left Stack: 1a (Row 1), 1b (Row 2)
    - Right Span: 1c (Spans Row 1 & 2)
    - Bottom Row: 2a (Full Width)
*/
.page-layout.layout-grid-4-right-span-merged {
    display: grid;
    /* 2 Columns */
    grid-template-columns: 1fr 1fr;
    /* 3 Rows */
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

/* --- Top Section --- */
/* Left Stack */
.layout-grid-4-right-span-merged .panel-1a {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-grid-4-right-span-merged .panel-1b {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Right Span */
.layout-grid-4-right-span-merged .panel-1c {
    grid-column: 2 / 3;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}

/* --- Bottom Row --- */
.layout-grid-4-right-span-merged .panel-2a {
    grid-column: 1 / 3; /* Spans both columns */
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-grid-4-right-span-merged">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
</div>
