<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 6 Panel ZigZag Spans (Portrait)
    - Row 1 & 2: Col 1 is Span (Panel A), Col 2 is Stacked (Panels B & C)
    - Row 3 & 4: Col 1 is Stacked (Panels D & E), Col 2 is Span (Panel F)
*/
.page-layout.layout-6-panel-span-left-span-right {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    height: 94vh;
}

/* --- Top Section: Left Span --- */
.layout-6-panel-span-left-span-right .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans 2 rows */
}
.layout-6-panel-span-left-span-right .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-6-panel-span-left-span-right .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* --- Bottom Section: Right Span --- */
.layout-6-panel-span-left-span-right .panel-D {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-6-panel-span-left-span-right .panel-E {
    grid-column: 1 / 2;
    grid-row: 4 / 5;
}
.layout-6-panel-span-left-span-right .panel-F {
    grid-column: 2 / 3;
    grid-row: 3 / 5; /* Spans 2 rows */
}
</style>

<div class="section-container page page-layout layout-6-panel-span-left-span-right">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
