<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Sidebar Right (Portrait Version)
    Redesigned into 2 columns, 4 rows:
    Top Half:
    - Row 1: 1a, 1b side-by-side
    - Row 2: 2a, 2b side-by-side
    Bottom Half:
    - Col 1: 2c (Row 3) and 2d (Row 4) stacked
    - Col 2: 1c spans both Rows 3 & 4
*/
.page-layout.layout-asymmetrical-with-sidebar {  
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: repeat(4, 1fr); /* 4 Rows */
    gap: 10px;
}

/* --- Top Half --- */
/* Row 1 */
.layout-asymmetrical-with-sidebar .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-asymmetrical-with-sidebar .panel-B { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-asymmetrical-with-sidebar .panel-D { 
    grid-column: 1 / 2; 
    grid-row: 2 / 3; 
}
.layout-asymmetrical-with-sidebar .panel-E { 
    grid-column: 2 / 3; 
    grid-row: 2 / 3; 
}

/* --- Bottom Half --- */
/* Col 1 Stack */
.layout-asymmetrical-with-sidebar .panel-F { 
    grid-column: 1 / 2; 
    grid-row: 3 / 4; 
}
.layout-asymmetrical-with-sidebar .panel-G { 
    grid-column: 1 / 2; 
    grid-row: 4 / 5; 
}

/* Col 2 Span */
.layout-asymmetrical-with-sidebar .panel-C { 
    grid-column: 2 / 3;
    grid-row: 3 / 5; /* Spans Row 3 & 4 */
}

</style>
<div class="section-container page page-layout layout-asymmetrical-with-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
    <div class="panel panel-G"></div>
</div>
