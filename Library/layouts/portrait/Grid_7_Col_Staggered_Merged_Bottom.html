<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 7-Track Staggered Merged Grid Bottom (Portrait Version)
    
    Redesigned into a stacked staggered flow with a merged bottom row:
    - Row 1: 1a (Left, Short), 1b (Right, spans Row 1 & 2)
    - Row 2: 2a (Left, Tall)
    - Row 3: 1c (Merged Full Width)
*/
.page-layout.layout-seven-col-staggered-merged-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 2fr 1.5fr; /* 3 Rows */
    gap: 10px;
}

/* --- Top Half (Staggered Left, Solid Right) --- */
.layout-seven-col-staggered-merged-bottom .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-seven-col-staggered-merged-bottom .panel-D {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Middle Span (Moved to Top Right) */
.layout-seven-col-staggered-merged-bottom .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 3; /* Spans alongside 1a and 2a */
}

/* --- Bottom Row (Merged Single Panel) --- */
.layout-seven-col-staggered-merged-bottom .panel-C {
    grid-column: 1 / 3; /* Spans both columns */
    grid-row: 3 / 4;
}
</style>

<div class="section-container page page-layout layout-seven-col-staggered-merged-bottom">
    <div class="panel panel-A"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
