<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid 3x2 (Portrait Version)
    Redesigned as 2 columns, 3 rows for better portrait flow.
*/
.page-layout.layout-grid-3x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

.layout-grid-3x2 .panel-1a { grid-column: 1 / 2; grid-row: 1 / 2; }
.layout-grid-3x2 .panel-1b { grid-column: 2 / 3; grid-row: 1 / 2; }
.layout-grid-3x2 .panel-1c { grid-column: 1 / 2; grid-row: 2 / 3; }
.layout-grid-3x2 .panel-2a { grid-column: 2 / 3; grid-row: 2 / 3; }
.layout-grid-3x2 .panel-2b { grid-column: 1 / 2; grid-row: 3 / 4; }
.layout-grid-3x2 .panel-2c { grid-column: 2 / 3; grid-row: 3 / 4; }
</style>
<div class="section-container portrait-page page-layout layout-grid-3x2">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
    <div class="panel panel-2c"></div>
</div>
