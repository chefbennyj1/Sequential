<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid 3x2 (Portrait Version)
    Redesigned as 2 columns, 3 rows for better portrait flow.
*/
.page-layout.layout-grid-3x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

.layout-grid-3x2 .panel-A { grid-column: 1 / 2; grid-row: 1 / 2; }
.layout-grid-3x2 .panel-B { grid-column: 2 / 3; grid-row: 1 / 2; }
.layout-grid-3x2 .panel-C { grid-column: 1 / 2; grid-row: 2 / 3; }
.layout-grid-3x2 .panel-D { grid-column: 2 / 3; grid-row: 2 / 3; }
.layout-grid-3x2 .panel-E { grid-column: 1 / 2; grid-row: 3 / 4; }
.layout-grid-3x2 .panel-F { grid-column: 2 / 3; grid-row: 3 / 4; }
</style>
<div class="section-container portrait-page page-layout layout-grid-3x2">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
