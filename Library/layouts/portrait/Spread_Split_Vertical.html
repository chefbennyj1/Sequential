<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Spread Split Vertical (Portrait)
    - Row 1: panel-A (Top Half)
    - Row 2: panel-B (Bottom Half)
*/
.page-layout.layout-spread-split-vertical {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

.layout-spread-split-vertical .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}

.layout-spread-split-vertical .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
</style>
<div class="section-container page page-layout layout-spread-split-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
</div>
