<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 3 Panel Top Span (Portrait)
    - Row 1: panel-A (Full width banner)
    - Row 2: panel-B, panel-C (Split 1:1)
*/
.page-layout.layout-3-panel-top-span {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    height: 94vh; /* Constraint for editor scaling */
    width: 100%;
}

.layout-3-panel-top-span .panel {
    width: 100%;
    height: 100%;
}

.layout-3-panel-top-span .panel-A {
    grid-column: 1 / 3;
    grid-row: 1;
}

.layout-3-panel-top-span .panel-B {
    grid-column: 1;
    grid-row: 2;
}

.layout-3-panel-top-span .panel-C {
    grid-column: 2;
    grid-row: 2;
}
</style>
<div class="section-container page page-layout layout-3-panel-top-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
