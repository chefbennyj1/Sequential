<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid Right Span Split Stack V2 (Portrait Version)

    - Row 1: panel-1a (Full width)
    - Row 2: panel-1b (Full width)
    - Row 3 & 4 (Left): panel-2a and panel-2b stacked.
    - Row 3 & 4 (Right): panel-1c spanning both rows.
*/
.page-layout.layout-grid-right-span-split-stack-v2 {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    grid-template-rows: 1fr 1fr 0.9fr 0.9fr;
    gap: 10px;
}

/* --- Row 1 (Full Width) --- */
.layout-grid-right-span-split-stack-v2 .panel-1a {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

/* --- Row 2 (Full Width) --- */
.layout-grid-right-span-split-stack-v2 .panel-1b {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}

/* --- Row 3 & 4 (Left Stack) --- */
.layout-grid-right-span-split-stack-v2 .panel-2a {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-grid-right-span-split-stack-v2 .panel-2b {
    grid-column: 1 / 2;
    grid-row: 4 / 5;
}

/* --- Row 3 & 4 (Right Span) --- */
.layout-grid-right-span-split-stack-v2 .panel-1c {
    grid-column: 2 / 3;
    grid-row: 3 / 5; /* Spans Row 3 and 4 */
}
</style>

<div class="section-container portrait-page page-layout layout-grid-right-span-split-stack-v2">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
    <div class="panel panel-1c"></div>
</div>
