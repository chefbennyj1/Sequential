<style>
@import url('/layouts/styles/base-comic-layout-5-panel-right-span-stacked.css');

/* 
    Layout: Right Span with Left Side Stack of 4 (Cinematic Portrait Version)
    Optimized for 16:9 image aspect ratios.
    
    - Row 1 & 2: Split 1.5:1. Left has 1a, 1b. Right has 1c (Span).
    - Row 3 & 4: Full Width Banners (2a, 2b).
*/
.page-layout.layout-5-panel-right-span-stacked {
    display: grid;
    /* Left column is wider to allow 1a/1b to be more rectangular */
    grid-template-columns: 1.5fr 1fr;
    /* Top rows are shorter to match the 16:9 letterbox feel */
    grid-template-rows: 0.9fr 0.9fr 1.1fr 1.1fr;
    gap: 10px;
}

/* --- Top Section --- */
.layout-5-panel-right-span-stacked .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-5-panel-right-span-stacked .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Right Span: Now a slender vertical focus panel */
.layout-5-panel-right-span-stacked .panel-C {
    grid-column: 2 / 3;
    grid-row: 1 / 3; /* Spans top 2 rows */
}

/* --- Bottom Banners (Full Width Cinematic) --- */
.layout-5-panel-right-span-stacked .panel-D {
    grid-column: 1 / 3; 
    grid-row: 3 / 4;
}
.layout-5-panel-right-span-stacked .panel-E {
    grid-column: 1 / 3; 
    grid-row: 4 / 5;
}
</style>

<div class="section-container portrait-page page-layout layout-5-panel-right-span-stacked">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
