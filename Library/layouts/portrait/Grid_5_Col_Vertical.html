<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5 Vertical Columns (Portrait Version)
    Redesigned into 2 rows:
    Row 1: 1a, 1b (2 panels side-by-side)
    Row 2: 1c, 1d, 1e (3 panels side-by-side)
*/
.page-layout.layout-five-col-vertical {
    display: grid;
    /* 6 columns allows for clean division of 2 (3/3) and 3 (2/2/2) */
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Row 1 (Two Panels) */
.layout-five-col-vertical .panel-A {
    grid-column: 1 / 4;
    grid-row: 1 / 2;
}
.layout-five-col-vertical .panel-B {
    grid-column: 4 / 7;
    grid-row: 1 / 2;
}

/* Row 2 (Three Panels) */
.layout-five-col-vertical .panel-C {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}
.layout-five-col-vertical .panel-D {
    grid-column: 3 / 5;
    grid-row: 2 / 3;
}
.layout-five-col-vertical .panel-E {
    grid-column: 5 / 7;
    grid-row: 2 / 3;
}
</style>
<div class="section-container portrait-page page-layout layout-five-col-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
