<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Mixed Two Tall One Stack V2 (Portrait Version)
    
    - Row 1: panel-A and panel-B (Side-by-side, compressed)
    - Row 2: panel-C (Full Width, Focus)
    - Row 3: panel-D (Full Width, Focus)
*/
.page-layout.layout-mixed-two-tall-stack-v2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Balanced: Top row is tall enough for 9:16, but bottom rows still get solid focus */
    grid-template-rows: 1.6fr 1fr 1fr;
    gap: 10px;
}

/* --- Top Row: Side-by-Side (Compressed) --- */
.layout-mixed-two-tall-stack-v2 .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-mixed-two-tall-stack-v2 .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* --- Bottom Rows: Stacked (Focus) --- */
.layout-mixed-two-tall-stack-v2 .panel-C {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}
.layout-mixed-two-tall-stack-v2 .panel-D {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-mixed-two-tall-stack-v2">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
