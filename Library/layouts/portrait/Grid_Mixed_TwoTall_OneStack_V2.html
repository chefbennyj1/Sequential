<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Mixed Two Tall One Stack V2 (Portrait Version)
    
    - Row 1: panel-1a and panel-1b (Side-by-side, compressed)
    - Row 2: panel-2a (Full Width, Focus)
    - Row 3: panel-2b (Full Width, Focus)
*/
.page-layout.layout-mixed-two-tall-stack-v2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Balanced: Top row is tall enough for 9:16, but bottom rows still get solid focus */
    grid-template-rows: 1.6fr 1fr 1fr;
    gap: 10px;
}

/* --- Top Row: Side-by-Side (Compressed) --- */
.layout-mixed-two-tall-stack-v2 .panel-1a {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-mixed-two-tall-stack-v2 .panel-1b {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* --- Bottom Rows: Stacked (Focus) --- */
.layout-mixed-two-tall-stack-v2 .panel-2a {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}
.layout-mixed-two-tall-stack-v2 .panel-2b {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-mixed-two-tall-stack-v2">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
