<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Four Panel Grid with Left Side Span (Portrait Version)
    Redesigned to keep the left span:
    - Left Span: 1a (Spans Rows 1 & 2)
    - Right Stack: 1b (Row 1), 1c (Row 2)
    - Bottom Row: 2a (Left), 2b (Right)
*/
.page-layout.layout-four-panel-grid-with-left-side-span {
    display: grid;
    /* 2 Columns */
    grid-template-columns: 1fr 1fr;
    /* 3 Rows */
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

/* --- Top Section --- */
/* Left Span */
.layout-four-panel-grid-with-left-side-span .panel-1a {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}

/* Right Stack */
.layout-four-panel-grid-with-left-side-span .panel-1b {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-four-panel-grid-with-left-side-span .panel-1c {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* --- Bottom Row --- */
.layout-four-panel-grid-with-left-side-span .panel-2a {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-four-panel-grid-with-left-side-span .panel-2b {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}
</style>
<div class="section-container portrait-page page-layout layout-four-panel-grid-with-left-side-span">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
