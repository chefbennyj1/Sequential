<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5 Panel Top Bottom Banner Right Tall (Portrait)
    - Row 1: panel-A (Full Width Banner)
    - Row 2: panel-B (Mid Left Top)
    - Row 3: panel-C (Mid Left Bottom)
    - Row 2-3: panel-D (Mid Right Tall Span)
    - Row 4: panel-E (Full Width Banner)
*/
.page-layout.layout-5-panel-top-bottom-banner-right-tall {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr 1fr auto;
    gap: 10px;
    height: 94vh;
    width: 100%;
}

.layout-5-panel-top-bottom-banner-right-tall .panel {
    width: 100%;
    height: 100%;
}

/* Banners */
.layout-5-panel-top-bottom-banner-right-tall .panel-A {
    grid-column: 1 / 3;
    grid-row: 1;
    aspect-ratio: 21 / 9;
}
.layout-5-panel-top-bottom-banner-right-tall .panel-E {
    grid-column: 1 / 3;
    grid-row: 4;
    aspect-ratio: 21 / 9;
}

/* Mid Left Stack */
.layout-5-panel-top-bottom-banner-right-tall .panel-B {
    grid-column: 1 / 2;
    grid-row: 2;
}
.layout-5-panel-top-bottom-banner-right-tall .panel-C {
    grid-column: 1 / 2;
    grid-row: 3;
}

/* Mid Right Tall */
.layout-5-panel-top-bottom-banner-right-tall .panel-D {
    grid-column: 2 / 3;
    grid-row: 2 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-5-panel-top-bottom-banner-right-tall">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
