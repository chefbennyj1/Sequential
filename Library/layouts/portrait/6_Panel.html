<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid 3x2 (Portrait Version)
    Redesigned as 2 columns, 3 rows for better portrait flow.
*/
.page-layout.layout-6-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

.layout-6-panel .panel-A { grid-column: 1 / 2; grid-row: 1 / 2; }
.layout-6-panel .panel-B { grid-column: 2 / 3; grid-row: 1 / 2; }
.layout-6-panel .panel-C { grid-column: 1 / 2; grid-row: 2 / 3; }
.layout-6-panel .panel-D { grid-column: 2 / 3; grid-row: 2 / 3; }
.layout-6-panel .panel-E { grid-column: 1 / 2; grid-row: 3 / 4; }
.layout-6-panel .panel-F { grid-column: 2 / 3; grid-row: 3 / 4; }
</style>
<div class="section-container page page-layout layout-6-panel">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
