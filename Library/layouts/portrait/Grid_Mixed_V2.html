<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid Mixed V2 (Portrait Version)
    Redesigned into 5 rows, 3 columns to allow proportional splits.
    Top:
    - Row 1: 1c (Spans all columns)
    - Row 2: 1a (wide, spans 2 cols), 1b (narrow, 1 col)
    - Row 3: 2a (narrow, 1 col), 2b (wide, spans 2 cols) (Inversed)
    Bottom:
    - Row 4: 2c (Spans all columns)
*/
.page-layout.layout-mixed-v2 {
    display: grid;
    /* 3 Columns to allow for 2/3 and 1/3 offsets */
    grid-template-columns: 1fr 1fr 1fr; 
    /* 4 Rows */
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
}

/* Row 1: Top Banner */
.layout-mixed-v2 .panel-C {
    grid-column: 1 / 4; /* Spans 3 columns */
    grid-row: 1 / 2;
}

/* Row 2: Offset Split (Wide Left, Narrow Right) */
.layout-mixed-v2 .panel-A {
    grid-column: 1 / 3; /* Spans 2 columns */
    grid-row: 2 / 3;
}
.layout-mixed-v2 .panel-B {
    grid-column: 3 / 4; /* Spans 1 column */
    grid-row: 2 / 3;
}

/* Row 3: Offset Split Inversed (Narrow Left, Wide Right) */
.layout-mixed-v2 .panel-D {
    grid-column: 1 / 2; /* Spans 1 column */
    grid-row: 3 / 4;
}
.layout-mixed-v2 .panel-E {
    grid-column: 2 / 4; /* Spans 2 columns */
    grid-row: 3 / 4;
}

/* Row 4: Full Stack Bottom */
.layout-mixed-v2 .panel-F {
    grid-column: 1 / 4; /* Spans 3 columns */
    grid-row: 4 / 5;
}

</style>
<div class="section-container page page-layout layout-mixed-v2">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
