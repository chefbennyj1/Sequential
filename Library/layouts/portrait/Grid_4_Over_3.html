<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Four On Top, Three On Bottom (Portrait Version)
    Redesigned into 4 rows as requested:
    Row 1: 1a, 1b
    Row 2: 1c, 1d
    Row 3: 2a, 2b
    Row 4: 2c
*/
.page-layout.layout-four-on-top-three-on-bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 1fr 1fr 1.5fr; /* 4 Rows, bottom slightly taller */
    gap: 10px;
}

/* Row 1 (1a, 1b) */
.layout-four-on-top-three-on-bottom-grid .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-four-on-top-three-on-bottom-grid .panel-B { 
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* Row 2 (1c, 1d) */
.layout-four-on-top-three-on-bottom-grid .panel-C { 
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-four-on-top-three-on-bottom-grid .panel-D { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Row 3 (2a, 2b) */
.layout-four-on-top-three-on-bottom-grid .panel-E { 
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-four-on-top-three-on-bottom-grid .panel-F { 
    grid-column: 2 / 3;
    grid-row: 3 / 4;
    & img {
        position: absolute;
        left: 0;
    }
}

/* Row 4 (2c spans both columns) */
.layout-four-on-top-three-on-bottom-grid .panel-G { 
    grid-column: 1 / 3;
    grid-row: 4 / 5;
}
</style>
<div class="section-container page page-layout layout-four-on-top-three-on-bottom-grid">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
    <div class="panel panel-G"></div>
</div>
