<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Four On Top, Three On Bottom (Portrait Version)
    Redesigned into 4 rows as requested:
    Row 1: 1a, 1b
    Row 2: 1c, 1d
    Row 3: 2a, 2b
    Row 4: 2c
*/
.page-layout.layout-four-on-top-three-on-bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 1fr 1fr 1.5fr; /* 4 Rows, bottom slightly taller */
    gap: 10px;
}

/* Row 1 (1a, 1b) */
.layout-four-on-top-three-on-bottom-grid .panel-1a { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-four-on-top-three-on-bottom-grid .panel-1b { 
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* Row 2 (1c, 1d) */
.layout-four-on-top-three-on-bottom-grid .panel-1c { 
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-four-on-top-three-on-bottom-grid .panel-1d { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Row 3 (2a, 2b) */
.layout-four-on-top-three-on-bottom-grid .panel-2a { 
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-four-on-top-three-on-bottom-grid .panel-2b { 
    grid-column: 2 / 3;
    grid-row: 3 / 4;
    & img {
        position: absolute;
        left: 0;
    }
}

/* Row 4 (2c spans both columns) */
.layout-four-on-top-three-on-bottom-grid .panel-2c { 
    grid-column: 1 / 3;
    grid-row: 4 / 5;
}
</style>
<div class="section-container portrait-page page-layout layout-four-on-top-three-on-bottom-grid">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-1d"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
    <div class="panel panel-2c"></div>
</div>
