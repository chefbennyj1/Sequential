<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: ZigZag 2x2 (Portrait Version)
    Redesigned as Top Span, Middle Split, Bottom Span
*/
.page-layout.layout-zigzag-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 1fr 1fr; /* 3 Equal Rows */
    gap: 10px;
}

/* Top Row: Spans both columns */
.layout-zigzag-2x2 .panel-1a { 
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

/* Middle Row: Side-by-side */
/* Note: The landscape HTML used panel-1c here instead of 1b, so I kept 1c to match the existing DOM */
.layout-zigzag-2x2 .panel-1c { 
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-zigzag-2x2 .panel-2a { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Bottom Row: Spans both columns */
.layout-zigzag-2x2 .panel-2b { 
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-zigzag-2x2">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
