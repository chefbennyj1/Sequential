<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid 4 Col Middle Span (Merged) (Portrait Version)
    Redesigned into 3 rows:
    - Row 1: 1a (wide, top left), 1c (wide, top right)
    - Row 2: 1b (Large middle focus, spans full width)
    - Row 3: 2a (wide, bottom left), 2b (wide, bottom right)
*/
.page-layout.layout-four-column-middle-span-merged {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 2fr 1fr; /* Middle focus panel is tallest */
    gap: 10px;
}

/* Row 1 (Top Split) */
.layout-four-column-middle-span-merged .panel-1a { 
    grid-column: 1 / 2; 
    grid-row: 1 / 2; 
}
.layout-four-column-middle-span-merged .panel-1c { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2; 
}

/* Row 2 (Middle Focus) */
.layout-four-column-middle-span-merged .panel-1b { 
    grid-column: 1 / 3; 
    grid-row: 2 / 3; 
}

/* Row 3 (Bottom Split) */
.layout-four-column-middle-span-merged .panel-2a { 
    grid-column: 1 / 2; 
    grid-row: 3 / 4; 
}
.layout-four-column-middle-span-merged .panel-2b { 
    grid-column: 2 / 3; 
    grid-row: 3 / 4; 
}

</style>
<div class="section-container portrait-page page-layout layout-four-column-middle-span-merged">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
