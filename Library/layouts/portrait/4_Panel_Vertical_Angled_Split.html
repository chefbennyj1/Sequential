<style>
@import url('/layouts/styles/base-comic-layout.css');

/*
    Layout: 4-Panel Vertical Angled Split (Portrait)

    Two straight cuts across the whole page, crossing at dead centre:

        H (angled horizontal):  page (0,40) -> (100,60)
        V (angled vertical):    page (40,0) -> (60,100)
        intersection:           page (50,50)

    METHOD - read this before building another angled layout.

    Percentages inside clip-path are relative to the panel's OWN box, so two
    panels sharing a cut cannot use the same numbers. Rather than hand-tuning
    each one until the diagonals line up, define every cut in page coordinates
    (0-100 across the whole page) and convert:

        1. List each panel's corners in page coordinates.
        2. Its box is the bounding box of those corners:
           left/top = min x/y, width/height = max - min.
        3. Convert each corner into the box:
           localX = (pageX - left) / width  * 100
           localY = (pageY - top)  / height * 100

    Panels sharing a cut then derive from the same page-space line, so the
    seams meet exactly - no tuning.

    THE GUTTER. Shift both endpoints of a cut by the same amount along one
    axis: horizontally for a near-vertical cut, vertically for a near-
    horizontal one. Equal shifts keep the two edges parallel, so the gap stays
    a constant width down the whole seam. Panels on opposite sides shift in
    opposite directions, and the page shows through the difference.
    A corner sitting on both cuts shifts on both axes, which opens the small
    square of page at the crossing point.

    Watch for corners that LOOK like page corners in local coordinates but are
    not. Panel B's bottom right is local 100% 100%, yet in page space it is
    (100,60) - a point on H. Miss the shift there and that gutter tapers from
    full width at the centre to half width at the page edge.

    Panel  Page corners                            Box (l, t, w, h)
    A      (0,0)  (40,0)   (50,50)  (0,40)         0,  0,  50, 50
    B      (40,0) (100,0)  (100,60) (50,50)        40, 0,  60, 60
    C      (0,40) (50,50)  (60,100) (0,100)        0,  40, 60, 60
    D      (50,50)(100,60) (100,100)(60,100)       50, 50, 50, 50

    THE PANEL FRAME. clip-path cuts a border off with everything else, so the
    4px black edge every other layout gets from base-comic-layout's
    .panel { border } cannot be used here. Instead each panel's ::after paints
    the frame ON TOP as a ring: an oversized rectangle with the panel's shape,
    inset by --edge, punched out of it as a hole via polygon(evenodd, ...).
    The pseudo-element belongs to the panel, so the panel's own clip-path trims
    the ring's outer edge back to the panel shape for free - which is why the
    rectangle can be oversized, guaranteeing coverage at the page edge without
    any extra arithmetic.

    Do NOT draw the frame by clipping the img to an inset polygon instead. The
    img is a direct child sized 100%/100%, so it shares the panel's coordinate
    space and that looks equivalent - but clip-path is resolved in an element's
    LOCAL space, before its own transform. page.json media entries routinely
    carry a transform (page77 panel-B has scale(1.10) with a shifted
    transform-origin, saved while framing the art), and that scales the img's
    clip along with the picture: border doubled on one side, gone on the other.
    The ring has no such coupling; the art can be scaled, panned or replaced and
    the frame does not move.

    Do not add a wrapper div for this either - pageInitializer clears
    panel.innerHTML before every render and would delete it. Pseudo-elements
    survive because they are not part of innerHTML.

    z-index 10 keeps the ring above both the img and any overlayImage (z-index
    5). It cannot cover dialogue: SceneManager renders every bubble to the page
    layer, not into the panel (see its "ALWAYS render to the page layer"). It is
    pointer-events: none so it cannot swallow editor clicks on the panel.

    THE PAGE MARGIN. The white edge around the page is a border here, not the
    padding the grid layouts use: absolutely positioned panels resolve against
    the padding box, which INCLUDES padding but excludes border, so padding
    would be ignored while a border shrinks the whole coordinate system inside
    it - and every percentage above stays correct.

    Gutter colour is the page showing through, i.e. base-comic-layout's white.
    Do not try to set it on a two-class layout selector; that loses to
    .section-container.page.page-layout and is silently ignored.
*/

.page-layout.layout-vertical-angled-split-4-panel {
    display: block;
    position: relative;
    gap: 0;
    padding: 0;
    overflow: hidden;
    --cut: 5px;
    --edge: 4px;
    /*
        Border slope correction, applied where a cut meets a page edge. Such a
        corner is inset on BOTH axes, but moving --edge along a sloped line also
        moves you along it, so without this term the inner edge lands off the
        true inset line and the border tapers while still averaging --edge.

        --skewH = |H slope| * --edge, --skewV = |V slope| * --edge, both in px
        on the 6.625:10.25 content box:
            H rises 20% of the page height across its width -> 0.3132 -> 1.25px
            V runs  20% of the page width  down its height  -> 0.1277 -> 0.51px
        H slopes down to the right and V to the right going down, so on H the
        left end moves up and the right end down; on V the top end moves left
        and the bottom end right.
    */
    --skewH: 1.25px;
    --skewV: 0.51px;
}

/* White page margin. Border, not padding - see THE PAGE MARGIN above. */
.section-container.page.page-layout.layout-vertical-angled-split-4-panel {
    border: var(--panel-padding, 10px) solid #fff;
}

/*
    No panel drop shadow. base-comic-layout's box-shadow is painted outside the
    border box and clip-path removes it, and filter: drop-shadow on this element
    fails too - clip-path is applied AFTER filter, so the shadow is generated
    and then clipped away. A shadow here has to come from a positioned wrapper
    around the panel; see the note in Agents.md before adding one.
*/
.layout-vertical-angled-split-4-panel .panel {
    position: absolute;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

/* Top left - bounded by the top edge, V, H and the left edge */
.layout-vertical-angled-split-4-panel .panel-A {
    left: 0;
    top: 0;
    width: 50%;
    height: 50%;
    clip-path: polygon(
        0 0,
        calc(80% - var(--cut)) 0,
        calc(100% - var(--cut)) calc(100% - var(--cut)),
        0 calc(80% - var(--cut))
    );
}

.layout-vertical-angled-split-4-panel .panel-A::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    clip-path: polygon(evenodd,
        -2px -2px, calc(100% + 2px) -2px, calc(100% + 2px) calc(100% + 2px), -2px calc(100% + 2px),
        var(--edge) var(--edge),
        calc(80% - var(--cut) - var(--edge) + var(--skewV)) var(--edge),
        calc(100% - var(--cut) - var(--edge)) calc(100% - var(--cut) - var(--edge)),
        var(--edge) calc(80% - var(--cut) - var(--edge) + var(--skewH))
    );
}

/* Top right - V on its left, H along its bottom */
.layout-vertical-angled-split-4-panel .panel-B {
    left: 40%;
    top: 0;
    width: 60%;
    height: 60%;
    clip-path: polygon(
        var(--cut) 0,
        100% 0,
        100% calc(100% - var(--cut)),
        calc(16.667% + var(--cut)) calc(83.333% - var(--cut))
    );
}

.layout-vertical-angled-split-4-panel .panel-B::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    clip-path: polygon(evenodd,
        -2px -2px, calc(100% + 2px) -2px, calc(100% + 2px) calc(100% + 2px), -2px calc(100% + 2px),
        calc(var(--cut) + var(--edge) + var(--skewV)) var(--edge),
        calc(100% - var(--edge)) var(--edge),
        calc(100% - var(--edge)) calc(100% - var(--cut) - var(--edge) - var(--skewH)),
        calc(16.667% + var(--cut) + var(--edge)) calc(83.333% - var(--cut) - var(--edge))
    );
}

/* Bottom left - H along its top, V on its right */
.layout-vertical-angled-split-4-panel .panel-C {
    left: 0;
    top: 40%;
    width: 60%;
    height: 60%;
    clip-path: polygon(
        0 var(--cut),
        calc(83.333% - var(--cut)) calc(16.667% + var(--cut)),
        calc(100% - var(--cut)) 100%,
        0 100%
    );
}

.layout-vertical-angled-split-4-panel .panel-C::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    clip-path: polygon(evenodd,
        -2px -2px, calc(100% + 2px) -2px, calc(100% + 2px) calc(100% + 2px), -2px calc(100% + 2px),
        var(--edge) calc(var(--cut) + var(--edge) + var(--skewH)),
        calc(83.333% - var(--cut) - var(--edge)) calc(16.667% + var(--cut) + var(--edge)),
        calc(100% - var(--cut) - var(--edge) - var(--skewV)) calc(100% - var(--edge)),
        var(--edge) calc(100% - var(--edge))
    );
}

/* Bottom right - H along its top, V on its left */
.layout-vertical-angled-split-4-panel .panel-D {
    left: 50%;
    top: 50%;
    width: 50%;
    height: 50%;
    clip-path: polygon(
        var(--cut) var(--cut),
        100% calc(20% + var(--cut)),
        100% 100%,
        calc(20% + var(--cut)) 100%
    );
}

.layout-vertical-angled-split-4-panel .panel-D::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    clip-path: polygon(evenodd,
        -2px -2px, calc(100% + 2px) -2px, calc(100% + 2px) calc(100% + 2px), -2px calc(100% + 2px),
        calc(var(--cut) + var(--edge)) calc(var(--cut) + var(--edge)),
        calc(100% - var(--edge)) calc(20% + var(--cut) + var(--edge) - var(--skewH)),
        calc(100% - var(--edge)) calc(100% - var(--edge)),
        calc(20% + var(--cut) + var(--edge) - var(--skewV)) calc(100% - var(--edge))
    );
}
</style>
<div class="section-container page page-layout layout-vertical-angled-split-4-panel">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
