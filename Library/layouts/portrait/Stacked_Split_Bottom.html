<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Stacked Split Bottom (Portrait)
    - Row 1: panel-A (Full width)
    - Row 2: panel-B (Full width)
    - Row 3: panel-C and panel-D (Split, 2b is wider)
*/
.page-layout.layout-stacked-split-bottom {
    display: grid;
    grid-template-columns: 1fr 1.5fr; /* 2b is 1.5x wider than 2a */
    grid-template-rows: 1fr 1fr 1.2fr;
    gap: 10px;
}

.layout-stacked-split-bottom .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

.layout-stacked-split-bottom .panel-B {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}

.layout-stacked-split-bottom .panel-C {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}

.layout-stacked-split-bottom .panel-D {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}
</style>
<div class="section-container portrait-page page-layout layout-stacked-split-bottom">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
