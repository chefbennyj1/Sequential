<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid 4 Col Middle Span (Portrait Version)
    Redesigned into 4 rows to fit specific images perfectly:
    - Row 1: 1a (Full width top banner)
    - Row 2: 1b, 1c (Side-by-side, boxy)
    - Row 3: 1d, 2a (Side-by-side, halves)
    - Row 4: 2b (Full width bottom anchor)
*/
.page-layout.layout-four-column-middle-span {
    display: grid;
    /* 6 columns allows for easy halves (3/3) */
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 1.2fr 2fr 1fr 1fr; /* Added 4th row */
    gap: 10px;
}

/* Row 1 (Full Width) */
.layout-four-column-middle-span .panel-1a { 
    grid-column: 1 / 7; 
    grid-row: 1 / 2; 
}

/* Row 2 (Halves) */
.layout-four-column-middle-span .panel-1b { 
    grid-column: 1 / 4; 
    grid-row: 2 / 3; 
}
.layout-four-column-middle-span .panel-1c { 
    grid-column: 4 / 7; 
    grid-row: 2 / 3; 
}

/* Row 3 (Halves) */
.layout-four-column-middle-span .panel-1d { 
    grid-column: 1 / 4; 
    grid-row: 3 / 4; 
}
.layout-four-column-middle-span .panel-2a { 
    grid-column: 4 / 7; 
    grid-row: 3 / 4; 
}

/* Row 4 (Full Width) */
.layout-four-column-middle-span .panel-2b { 
    grid-column: 1 / 7; 
    grid-row: 4 / 5; 
}

</style>
<div class="section-container portrait-page page-layout layout-four-column-middle-span">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-1d"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
