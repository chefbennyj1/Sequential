<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Vertical Strips 4 (Portrait Version)
    Redesigned as a 2x2 grid for better portrait flow, 
    mapping the 4 vertical strips into a square grid.
*/
.page-layout.layout-four-strip-vertical {  
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Row 1 */
.layout-four-strip-vertical .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-four-strip-vertical .panel-B { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-four-strip-vertical .panel-C { 
    grid-column: 1 / 2;
    grid-row: 2 / 3; 
}
.layout-four-strip-vertical .panel-D { 
    grid-column: 2 / 3; 
    grid-row: 2 / 3; 
}
</style>
<div class="section-container portrait-page page-layout layout-four-strip-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
