<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Vertical Strips 4 (Portrait Version)
    Redesigned as a 2x2 grid for better portrait flow.
*/
.page-layout.layout-four-strip-vertical {  
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Row 1 */
.layout-four-strip-vertical .panel-1a { 
    grid-column: 1 / 2;
    grid-row: 1 / 2; 
}
.layout-four-strip-vertical .panel-1b { 
    grid-column: 2 / 3;
    grid-row: 1 / 2; 
}

/* Row 2 */
.layout-four-strip-vertical .panel-1c { 
    grid-column: 1 / 2;
    grid-row: 2 / 3; 
}
.layout-four-strip-vertical .panel-1d { 
    grid-column: 2 / 3;
    grid-row: 2 / 3; 
}
</style>
<div class="section-container portrait-page page-layout layout-four-strip-vertical">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-1d"></div>
</div>
