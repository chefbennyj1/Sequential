<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 4 Panel Left Span (Portrait)
    Synchronized with Landscape:
    - Panel A: Tall Left Span (Spans Row 1 & 2)
    - Panel B: Right Stack Top
    - Panel C: Right Stack Bottom
    - Panel D: Bottom Full Width Banner
*/
.page-layout.layout-4-panel-left-span {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

/* Left Span */
.layout-4-panel-left-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}

/* Right Stack */
.layout-4-panel-left-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-4-panel-left-span .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Bottom Row */
.layout-4-panel-left-span .panel-D {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container page page-layout layout-4-panel-left-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
