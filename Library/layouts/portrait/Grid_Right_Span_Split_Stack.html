<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid Right Span Split Stack (Portrait Version)
    
    - Row 1 & 2 (Left): panel-A and panel-B stacked.
    - Row 1 & 2 (Right): panel-C spanning both rows.
    - Row 3: panel-D (Full width)
    - Row 4: panel-E (Full width)
*/
.page-layout.layout-grid-right-span-split-stack {
    display: grid;
    /* Left column wider for 16:9 panels */
    grid-template-columns: 1.5fr 1fr;
    /* Adjusted Rows: Row 4 (1.4fr) is taller than Row 3 (1fr) */
    grid-template-rows: 0.9fr 0.9fr 1fr 1.4fr;
    gap: 10px;
}

/* --- Top Section --- */
.layout-grid-right-span-split-stack .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-grid-right-span-split-stack .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Right Span */
.layout-grid-right-span-split-stack .panel-C {
    grid-column: 2 / 3;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}

/* --- Bottom Banners (Full Width) --- */
.layout-grid-right-span-split-stack .panel-D {
    grid-column: 1 / 3; 
    grid-row: 3 / 4;
}

/* Pin the image in 2a to the top so it doesn't crop the top details */
.layout-grid-right-span-split-stack .panel-D img,
.layout-grid-right-span-split-stack .panel-D video {
    object-position: top center;
}

.layout-grid-right-span-split-stack .panel-E {
    grid-column: 1 / 3; 
    grid-row: 4 / 5;
}
</style>

<div class="section-container portrait-page page-layout layout-grid-right-span-split-stack">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
