<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 5 Panel Left Span (Portrait)
    - Left Span: panel-A (Spans Rows 1 & 2)
    - Right Stack: panel-B (Row 1), panel-C (Row 2)
    - Bottom Row: panel-D (Left), panel-E (Right)
*/
.page-layout.layout-5-panel-left-span {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
    height: 94vh; /* Constraint for editor scaling */
    width: 100%;
}

.layout-5-panel-left-span .panel {
    width: 100%;
    height: 100%;
}

/* --- Top Section --- */
/* Left Span */
.layout-5-panel-left-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans Row 1 and 2 */
}

/* Right Stack */
.layout-5-panel-left-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-5-panel-left-span .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* --- Bottom Row --- */
.layout-5-panel-left-span .panel-D {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-5-panel-left-span .panel-E {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}
</style>
<div class="section-container page page-layout layout-5-panel-left-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
