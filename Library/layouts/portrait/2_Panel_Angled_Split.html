<style>
@import url('/layouts/styles/base-comic-layout.css');

/*
    Layout: Angled Split 2-Panel (Portrait)

    One straight cut across the page:

        H  page (0,60) -> (100,30)

    Built with the page-coordinate method - see 4_Panel_Vertical_Angled_Split.html
    for the full explanation of METHOD, THE GUTTER, THE PANEL FRAME and THE PAGE
    MARGIN. In short: corners are listed in page coordinates, each panel's box is
    their bounding box, and the corners are converted into that box, so both
    panels derive their shared edge from the same line instead of being tuned
    against each other.

    Panel  Page corners                        Box (l, t, w, h)
    A      (0,0)  (100,0)  (100,30) (0,60)     0, 0,  100, 60
    B      (0,60) (100,30) (100,100)(0,100)    0, 30, 100, 70

    A sits above H so its corners on H shift up by --cut; B sits below so its
    corners shift down. The page shows through the difference as an even white
    gutter. The black panel border - which clip-path otherwise makes impossible,
    since it cuts a real border off - is painted on top by each panel's ::after
    as a ring: the panel shape inset by --edge, punched out of an oversized
    rectangle. Never draw it by clipping the img instead; media entries carry
    transforms that would scale that clip along with the artwork. Panel B on
    page77 is the case that proves it.

    This replaces a hand-tuned version built on overlapping flex items
    (height:120%/140%, top:-40%) whose clip-path percentages resolved against
    each panel's own differently sized box. Its two edges were near parallel but
    not exactly, so the gutter tapered from 15.6px at the right of the page to
    17.3px at the left. The cut here matches that version's midline within a
    third of a percent and both panel boxes keep effectively the same aspect
    ratio, so artwork already placed on existing pages crops the same way.

    That version also declared `background: #000` and `padding: 0` on a
    two-class selector. Both lost to .section-container.page.page-layout and
    were silently ignored - it has always rendered with a white gutter and
    base's 10px page padding. Neither is declared here; the white page margin is
    a border, because absolutely positioned panels resolve against the padding
    box and would ignore padding.
*/

.page-layout.layout-angled-split-2-panel {
    display: block;
    position: relative;
    gap: 0;
    overflow: hidden;
    --cut: 5px;
    --edge: 4px;
    /*
        Slope correction for the border, applied where the cut meets a page
        edge. Such a corner is inset on BOTH axes - by --edge in x for the page
        edge, by --edge in y for the cut - but moving --edge along x on a sloped
        line also moves you along it, so without this term the inner edge lands
        off the true inset line and tilts against the outer one. That tilts the
        border from 2.1px at one end of the page to 5.9px at the other while
        still averaging 4px in the middle, which is easy to miss.

        --skew = |cut slope in px| * --edge. Here the cut drops 30% of the page
        height across its full width, so on the 6.625:10.25 content box the
        slope is 0.3 * (contentH / contentW) = 0.4697, giving 1.88px. The
        content box aspect shifts by under half a percent across any sane
        viewport, so a fixed length is accurate to a hundredth of a pixel.

        The left end of the cut moves down by --skew, the right end up, which is
        simply following the line rather than cutting across it.
    */
    --skew: 1.88px;
}

/* White page margin. Border, not padding - see above. */
.section-container.page.page-layout.layout-angled-split-2-panel {
    border: var(--panel-padding, 10px) solid #fff;
}

/* No drop shadow: clip-path is applied after filter, so one cannot be cast
   from the panel itself. See Agents.md. */
.layout-angled-split-2-panel .panel {
    position: absolute;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

/* Upper panel - the page above the cut */
.layout-angled-split-2-panel .panel-A {
    left: 0;
    top: 0;
    width: 100%;
    height: 60%;
    clip-path: polygon(
        0 0,
        100% 0,
        100% calc(50% - var(--cut)),
        0 calc(100% - var(--cut))
    );
}

.layout-angled-split-2-panel .panel-A::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    clip-path: polygon(evenodd,
        -2px -2px, calc(100% + 2px) -2px, calc(100% + 2px) calc(100% + 2px), -2px calc(100% + 2px),
        var(--edge) var(--edge),
        calc(100% - var(--edge)) var(--edge),
        calc(100% - var(--edge)) calc(50% - var(--cut) - var(--edge) + var(--skew)),
        var(--edge) calc(100% - var(--cut) - var(--edge) - var(--skew))
    );
}

/* Lower panel - the page below the cut */
.layout-angled-split-2-panel .panel-B {
    left: 0;
    top: 30%;
    width: 100%;
    height: 70%;
    clip-path: polygon(
        0 calc(42.857% + var(--cut)),
        100% var(--cut),
        100% 100%,
        0 100%
    );
}

.layout-angled-split-2-panel .panel-B::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    clip-path: polygon(evenodd,
        -2px -2px, calc(100% + 2px) -2px, calc(100% + 2px) calc(100% + 2px), -2px calc(100% + 2px),
        var(--edge) calc(42.857% + var(--cut) + var(--edge) - var(--skew)),
        calc(100% - var(--edge)) calc(var(--cut) + var(--edge) + var(--skew)),
        calc(100% - var(--edge)) calc(100% - var(--edge)),
        var(--edge) calc(100% - var(--edge))
    );
}
</style>
<div class="section-container page page-layout layout-angled-split-2-panel">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
</div>
