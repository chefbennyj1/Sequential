<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid ZigZag Tall Middle (Portrait)
    - Row 1: Panel A (Full Width Span)
    - Row 2: Panel B & C (Side-by-side, Tall 9:16 focus)
    - Row 3: Panel D (Full Width Span)
*/
.page-layout.layout-zigzag-tall-middle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Middle row is 2.5x taller than top/bottom to hit 9:16 aspect ratio */
    grid-template-rows: 1fr 2.5fr 1fr;
    gap: 10px;
}

/* Top Row */
.layout-zigzag-tall-middle .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

/* Middle Row (9:16 Panels) */
.layout-zigzag-tall-middle .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-zigzag-tall-middle .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Bottom Row */
.layout-zigzag-tall-middle .panel-D {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container page page-layout layout-zigzag-tall-middle">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
