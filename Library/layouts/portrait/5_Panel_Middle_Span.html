<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 5-Panel Center Focus (Portrait Version)
    Optimized for 16:9 cinematic aspect ratios.
*/
.page-layout.layout-5-panel-middle-span {
    display: grid;
    /* Left column is wider to allow 1a/1c to be more rectangular */
    grid-template-columns: 1.5fr 1fr; 
    /* Top rows are shorter to match the 16:9 letterbox feel */
    grid-template-rows: 0.9fr 0.9fr 1.1fr 1.1fr;
    gap: 10px;
    height: 94vh; /* Constraint for editor scaling */
    width: 100%;
}

.layout-5-panel-middle-span .panel {
    width: 100%;
    height: 100%;
}

/* Left side top stack */
.layout-5-panel-middle-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-5-panel-middle-span .panel-C {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Right side tall focus (The Right Span) */
.layout-5-panel-middle-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
}

/* Bottom Rows (Stacked Full Width) */
.layout-5-panel-middle-span .panel-D {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
.layout-5-panel-middle-span .panel-E {
    grid-column: 1 / 3;
    grid-row: 4 / 5;
}

</style>
<div class="section-container portrait-page page-layout layout-5-panel-middle-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
