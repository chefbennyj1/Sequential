<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Grid 4 Left Span (Merged Bottom) (Portrait Version)
    Redesigned as:
    Row 1: 1a (Full Width)
    Row 2: 1b, 1c (Split)
    Row 3: 2a (Full Width Banner)
*/
.page-layout.layout-grid-4-left-span-merged {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1.2fr 1fr 1fr;
    gap: 10px;
}

.layout-grid-4-left-span-merged .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}

.layout-grid-4-left-span-merged .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-grid-4-left-span-merged .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

.layout-grid-4-left-span-merged .panel-D {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-grid-4-left-span-merged">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
