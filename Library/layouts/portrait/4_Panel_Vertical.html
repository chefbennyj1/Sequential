<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 4 Panel Vertical (Portrait)
    Redesigned as a 2x2 grid for better portrait flow.
*/
.page-layout.layout-4-panel-vertical {  
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    height: 94vh;
    width: 100%;
}

.layout-4-panel-vertical .panel {
    width: 100%;
    height: 100%;
}

/* Row 1 */
.layout-4-panel-vertical .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-4-panel-vertical .panel-B { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-4-panel-vertical .panel-C { 
    grid-column: 1 / 2;
    grid-row: 2 / 3; 
}
.layout-4-panel-vertical .panel-D { 
    grid-column: 2 / 3; 
    grid-row: 2 / 3; 
}
</style>
<div class="section-container page page-layout layout-4-panel-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
