<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Four Panel Grid with Right Side Span (Portrait Version)
    Redesigned as:
    Row 1: 1a, 1b (Split)
    Row 2: 2a, 2b (Split)
    Row 3: 1c (Full Width Banner)
*/
.page-layout.layout-four-panel-grid-with-right-side-span {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1.2fr;
    gap: 10px;
}

/* Row 1 */
.layout-four-panel-grid-with-right-side-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-four-panel-grid-with-right-side-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-four-panel-grid-with-right-side-span .panel-D {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-four-panel-grid-with-right-side-span .panel-E {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Row 3: The Climax / Entrance */
.layout-four-panel-grid-with-right-side-span .panel-C {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}
</style>
<div class="section-container portrait-page page-layout layout-four-panel-grid-with-right-side-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-C"></div>
</div>
