<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 7-Track Staggered Merged Grid (Portrait Version)
    
    Redesigned into a stacked staggered flow:
    - Row 1: 1a (Left, Short), 1b (Right, spans Row 1 & 2)
    - Row 2: 2a (Left, Tall)
    - Row 3: 1c (Left), 2b (Right)
*/
.page-layout.layout-seven-col-staggered-merged {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 2fr 1.5fr; /* 3 Rows */
    gap: 10px;
}

/* --- Top Half (Staggered Left, Solid Right) --- */
.layout-seven-col-staggered-merged .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-seven-col-staggered-merged .panel-D {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Middle Span (Moved to Top Right) */
.layout-seven-col-staggered-merged .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 3; /* Spans alongside 1a and 2a */
}

/* --- Bottom Row (Side-by-side) --- */
.layout-seven-col-staggered-merged .panel-C {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}

.layout-seven-col-staggered-merged .panel-E {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}
</style>

<div class="section-container portrait-page page-layout layout-seven-col-staggered-merged">
    <div class="panel panel-A"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-E"></div>
</div>
