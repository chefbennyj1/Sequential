<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Split Sidebar Inverted (2a Merged) (Portrait Version)
    
    Redesigned into 4 rows:
    - Row 1-3: 1a (Right, spans 3 rows), 1b (Left, Row 1), 1c (Left, Row 2), 2a (Left, Row 3)
    - Row 4: 2b (Full width)
*/
.page-layout.layout-split-sidebar-inverted-merged-2a {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 Columns */
    grid-template-rows: 1fr 1fr 1fr 1.5fr; /* Bottom row is taller */
    gap: 10px;
}

/* --- Top Half (Stack) --- */
/* Left Side (Tall Focus) */
.layout-split-sidebar-inverted-merged-2a .panel-1a {
    grid-column: 1 / 2;
    grid-row: 1 / 4; /* Spans Row 1, 2, & 3 */
}

/* Right Side (Stacked) */
.layout-split-sidebar-inverted-merged-2a .panel-1b {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-split-sidebar-inverted-merged-2a .panel-1c {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}
.layout-split-sidebar-inverted-merged-2a .panel-2a {
    grid-column: 2 / 3; 
    grid-row: 3 / 4;
}

/* --- Bottom Half --- */
/* Row 4: Full Width */
.layout-split-sidebar-inverted-merged-2a .panel-2b {
    grid-column: 1 / 3;
    grid-row: 4 / 5;
}
</style>
<div class="section-container portrait-page page-layout layout-split-sidebar-inverted-merged-2a">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-1c"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
