<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Two Column With Sidebar (Portrait Version)
    Redesigned into 3 rows:
    Row 1: 1a (Top)
    Row 2: 2a (Middle)
    Row 3: 2b (Bottom)
*/
.page-layout.layout-two-column-with-sidebar {  
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1.5fr 1fr 1fr;
    gap: 10px;
}

.layout-two-column-with-sidebar .panel-1a { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}

.layout-two-column-with-sidebar .panel-2a { 
    grid-column: 1 / 2; 
    grid-row: 2 / 3; 
}

.layout-two-column-with-sidebar .panel-2b {
    grid-column: 1 / 2;
    grid-row: 3 / 4;  
}
</style>
<div class="section-container portrait-page page-layout layout-two-column-with-sidebar">
    <div class="panel panel-1a"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
</div>
