<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: Two Column Split (Portrait)
    Two equal columns side-by-side.
*/
.page-layout.layout-2-panel-grid-vertical {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 10px;
}

.layout-2-panel-grid-vertical .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}

.layout-2-panel-grid-vertical .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
</style>
<div class="section-container portrait-page page-layout layout-2-panel-grid-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
</div>
