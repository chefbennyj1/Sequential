<style>
@import url('/layouts/styles/base-comic-layout-portrait.css');

/* 
    Layout: 3-Panel Right Sidebar (Portrait)
    - Column 1: Panel A (Top), Panel B (Bottom)
    - Column 2: Panel C (Tall focus sidebar spanning both rows)
*/
.page-layout.layout-3-panel-right-sidebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

.layout-3-panel-right-sidebar .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}

.layout-3-panel-right-sidebar .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

.layout-3-panel-right-sidebar .panel-C {
    grid-column: 2 / 3;
    grid-row: 1 / 3; /* Spans both rows */
}
</style>

<div class="section-container portrait-page page-layout layout-3-panel-right-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
