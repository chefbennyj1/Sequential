<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 3 Panel Top Span (Landscape)
    Structure: Full-width top banner, two bottom panels.
*/
.page-layout.layout-3-panel-top-span {  
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1.5fr; /* Banner slightly shorter than bottom panels */
    gap: 10px;
    height: 94vh; /* Constraint for editor scaling */
    width: 100%;
}

.layout-3-panel-top-span .panel {
    width: 100%;
    height: 100%;
}

/* Panel A: Top Banner */
.layout-3-panel-top-span .panel-A { 
    grid-column: 1 / 3;
    grid-row: 1;
}

/* Panel B: Bottom Left */
.layout-3-panel-top-span .panel-B {
    grid-column: 1;
    grid-row: 2;
}

/* Panel C: Bottom Right */
.layout-3-panel-top-span .panel-C {
    grid-column: 2;
    grid-row: 2;
}
</style>
<div class="section-container page-layout layout-3-panel-top-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
