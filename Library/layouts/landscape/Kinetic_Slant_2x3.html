<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Kinetic Slant 2x3
    Landscape version of the slanted 2x3 layout.
*/
.page-layout.layout-kinetic-slant-2x3 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
}

.layout-kinetic-slant-2x3 .panel-A { grid-column: 1 / 2; grid-row: 1 / 2; }
.layout-kinetic-slant-2x3 .panel-B { grid-column: 2 / 3; grid-row: 1 / 2; }
.layout-kinetic-slant-2x3 .panel-C { grid-column: 1 / 2; grid-row: 2 / 3; }
.layout-kinetic-slant-2x3 .panel-D { grid-column: 2 / 3; grid-row: 2 / 3; }
.layout-kinetic-slant-2x3 .panel-E { grid-column: 1 / 3; grid-row: 3 / 4; }
</style>
<div class="section-container page-layout layout-kinetic-slant-2x3">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
