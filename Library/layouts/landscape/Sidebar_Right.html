<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Sidebar Right
    Refactored to explicit grid syntax.
    Grid: 6 columns, 4 rows.
*/
.page-layout.layout-asymmetrical-with-sidebar {  
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
}

/* --- Sidebar (Right) --- */
.layout-asymmetrical-with-sidebar .panel-C { 
    grid-column: 5 / 7;
    grid-row: 1 / 5; 
}

/* --- Main Content Area --- */

/* Top Left */
.layout-asymmetrical-with-sidebar .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 3;
}

/* Top Center */
.layout-asymmetrical-with-sidebar .panel-B { 
    grid-column: 3 / 5; 
    grid-row: 1 / 3;
}

/* Bottom Row (4 small panels) */
.layout-asymmetrical-with-sidebar .panel-D { 
    grid-column: 1 / 2; 
    grid-row: 3 / 5; 
}
.layout-asymmetrical-with-sidebar .panel-E { 
    grid-column: 2 / 3; 
    grid-row: 3 / 5; 
}
.layout-asymmetrical-with-sidebar .panel-F { 
    grid-column: 3 / 4; 
    grid-row: 3 / 5; 
}
.layout-asymmetrical-with-sidebar .panel-G { 
    grid-column: 4 / 5; 
    grid-row: 3 / 5; 
}

</style>
<div class="section-container page-layout layout-asymmetrical-with-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
    <div class="panel panel-G"></div>
</div>
