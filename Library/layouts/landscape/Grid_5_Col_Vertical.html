<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 5 Vertical Columns
    Grid: 5 cols x 2 rows (Panels span full height)
*/
.page-layout.layout-five-col-vertical {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
}

.layout-five-col-vertical .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
}
.layout-five-col-vertical .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
}
.layout-five-col-vertical .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 3;
}
.layout-five-col-vertical .panel-D {
    grid-column: 4 / 5;
    grid-row: 1 / 3;
}
.layout-five-col-vertical .panel-E {
    grid-column: 5 / 6;
    grid-row: 1 / 3;
}
</style>
<div class="section-container page-layout layout-five-col-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
