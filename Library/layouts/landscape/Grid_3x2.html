<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid 3x2 (Three columns, Two rows)
    Refactored to explicit grid syntax.
*/
.page-layout.layout-three-col-two-row-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
}

/* Row 1 */
.layout-three-col-two-row-grid .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-three-col-two-row-grid .panel-B { 
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-three-col-two-row-grid .panel-C { 
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-three-col-two-row-grid .panel-D { 
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-three-col-two-row-grid .panel-E { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}
.layout-three-col-two-row-grid .panel-F { 
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}
</style>
<div class="section-container page-layout layout-three-col-two-row-grid">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
