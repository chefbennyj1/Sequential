<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Four Panel Grid (2x2)
    Refactored to explicit grid syntax.
*/
.page-layout.layout-4-panel-grid {  
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: var(--panel-gap, 10px);
}

/* Row 1 */
.layout-4-panel-grid .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-4-panel-grid .panel-B { 
    grid-column: 2 / 3; 
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-4-panel-grid .panel-C { 
    grid-column: 1 / 2;
    grid-row: 2 / 3; 
}
.layout-4-panel-grid .panel-D { 
    grid-column: 2 / 3; 
    grid-row: 2 / 3; 
}
</style>
<div class="section-container page-layout layout-4-panel-grid">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
