<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 5-Panel Center Focus
    
    Structure:
    - Left Column: Stacked 16:9 panels (1a, 2a)
    - Center: Tall 9:16 panel spanning both rows (1b)
    - Right Column: Stacked 16:9 panels (1c, 2b)
*/
.page-layout.layout-five-panel-center-focus {
    display: grid;
    grid-template-columns: 1.1fr 0.8fr 1.1fr;
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
}

/* Left Column */
.layout-five-panel-center-focus .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-five-panel-center-focus .panel-D {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}

/* Center Column (Tall) */
.layout-five-panel-center-focus .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
}

/* Right Column */
.layout-five-panel-center-focus .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}
.layout-five-panel-center-focus .panel-E {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}

</style>
<div class="section-container page-layout layout-five-panel-center-focus">
    <div class="panel panel-A"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-E"></div>
</div>
