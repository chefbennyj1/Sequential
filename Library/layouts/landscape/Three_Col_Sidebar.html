<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Three Col Side Panel
    Grid: 12x4
*/
.page-layout.layout-three-col-side-panel {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
}

/* Left side main panels */
.layout-three-col-side-panel .panel-A {
    grid-column: 1 / 5;
    grid-row: 1 / 3;
}

.layout-three-col-side-panel .panel-B {
    grid-column: 5 / 10;
    grid-row: 1 / 3;
}

/* Right side tall panel (9:16 target) */
.layout-three-col-side-panel .panel-C {
    grid-column: 10 / 13;
    grid-row: 1 / 5;
}

/* Bottom row main panels */
.layout-three-col-side-panel .panel-D {
    grid-column: 1 / 5;
    grid-row: 3 / 5;
}

.layout-three-col-side-panel .panel-E {
    grid-column: 5 / 8;
    grid-row: 3 / 5;
}

.layout-three-col-side-panel .panel-F {
    grid-column: 8 / 10;
    grid-row: 3 / 5;
}
</style>
<div class="section-container page-layout layout-three-col-side-panel">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
