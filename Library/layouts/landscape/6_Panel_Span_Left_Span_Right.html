<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 6 Panel Span Left Span Right (Landscape)
    - Left Section: Span (A), Stack (B & C)
    - Right Section: Stack (D & E), Span (F)
*/
.page-layout.layout-6-panel-span-left-span-right {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Left Section */
.layout-6-panel-span-left-span-right .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
}
.layout-6-panel-span-left-span-right .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-6-panel-span-left-span-right .panel-C {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Right Section */
.layout-6-panel-span-left-span-right .panel-D {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}
.layout-6-panel-span-left-span-right .panel-E {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}
.layout-6-panel-span-left-span-right .panel-F {
    grid-column: 4 / 5;
    grid-row: 1 / 3;
}
</style>

<div class="section-container page-layout layout-6-panel-span-left-span-right">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
