<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Multi Column Strips
    Grid: 8 columns, 4 rows.
*/
.page-layout.layout-multi-column-strips {  
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
}

/* Top Row */
.layout-multi-column-strips .panel-A { 
    grid-column: 1 / 5;
    grid-row: 1 / 3;
}
.layout-multi-column-strips .panel-B { 
    grid-column: 5 / 6; 
    grid-row: 1 / 3; 
}
.layout-multi-column-strips .panel-C {
    grid-column: 6 / 7;
    grid-row: 1 / 3;  
}
.layout-multi-column-strips .panel-D {
    grid-column: 7 / 8;
    grid-row: 1 / 3;  
}
.layout-multi-column-strips .panel-E {
    grid-column: 8 / 9;
    grid-row: 1 / 3;  
}

/* Bottom Row */
.layout-multi-column-strips .panel-F { 
    grid-column: 1 / 4; 
    grid-row: 3 / 5; 
} 
.layout-multi-column-strips .panel-G { 
    grid-column: 4 / 9; 
    grid-row: 3 / 5; 
}
</style>
<div class="section-container page-layout layout-multi-column-strips">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
    <div class="panel panel-G"></div>
</div>
