<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 4 Panel 2 Tall (Landscape)
    - Column 1: Vertical Panel (9:16)
    - Column 2: Vertical Panel (9:16)
    - Column 3: Two Horizontal Panels (16:9) stacked vertically.
*/
.page-layout.layout-4-panel-2-tall {
    display: grid;
    grid-template-columns: 81fr 81fr 128fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    height: 94vh; /* Constraint for editor scaling */
    width: 100%;
}

.layout-4-panel-2-tall .panel {
    width: 100%;
    height: 100%;
}

/* Column 1: Tall Vertical (9:16) */
.layout-4-panel-2-tall .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
}

/* Column 2: Tall Vertical (9:16) */
.layout-4-panel-2-tall .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
}

/* Column 3: Top Stacked Wide (16:9) */
.layout-4-panel-2-tall .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}

/* Column 3: Bottom Stacked Wide (16:9) */
.layout-4-panel-2-tall .panel-D {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}
</style>
<div class="section-container page-layout layout-4-panel-2-tall">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
