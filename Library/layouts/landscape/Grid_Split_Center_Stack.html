<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid Split Center Stack
    Two vertical panels on the sides, two horizontal panels stacked in the middle.
*/
.page-layout.layout-split-center-stack {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr); 
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
}

/* Left Vertical */
.layout-split-center-stack .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 3;
}

/* Top Middle */
.layout-split-center-stack .panel-B { 
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* Bottom Middle */
.layout-split-center-stack .panel-C { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Right Vertical */
.layout-split-center-stack .panel-D { 
    grid-column: 3 / 4;
    grid-row: 1 / 3;
}

</style>

<div class="section-container page-layout layout-split-center-stack">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
