<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Angled Split 2-Panel (Landscape)
    Two panels divided by a diagonal cut.
*/
.page-layout.layout-angled-split-2-panel {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    gap: 0;
    padding: 0;
    background: #000; /* This creates the separation line color */
}

.layout-angled-split-2-panel .panel {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

.layout-angled-split-2-panel .panel-A {
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 60%);
}

.layout-angled-split-2-panel .panel-B {
    clip-path: polygon(0 61.5%, 100% 41.5%, 100% 100%, 0 100%);
}
</style>
<div class="section-container page-layout layout-angled-split-2-panel">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
</div>
