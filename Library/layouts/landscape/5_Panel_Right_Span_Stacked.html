<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Right Span with Left Side Stack of 4 (Landscape Version)
    
    - Left Stack: 1a, 1b, 2a, 2b
    - Right Span: 1c (Full Height)
*/
.page-layout.layout-5-panel-right-span-stacked {
    display: grid;
    /* Give the left stack more room for 16:9 ratio in landscape */
    grid-template-columns: 1.8fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

/* --- Left Stack --- */
.layout-5-panel-right-span-stacked .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-5-panel-right-span-stacked .panel-B {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-5-panel-right-span-stacked .panel-D {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-5-panel-right-span-stacked .panel-E {
    grid-column: 1 / 2;
    grid-row: 4 / 5;
}

/* --- Right Span --- */
.layout-5-panel-right-span-stacked .panel-C {
    grid-column: 2 / 3;
    grid-row: 1 / 5;
}
</style>

<div class="section-container page-layout layout-5-panel-right-span-stacked">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
