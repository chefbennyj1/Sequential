<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Cinematic 16:9
    A single panel perfectly scaled to 16:9, centered vertically.
    Creates a cinematic "letterbox" effect on the tall comic page.
*/
.page-layout.layout-cinematic-16x9 {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: var(--page-background, #000000); /* Dark background for cinematic feel */
    padding: 10px;
    box-sizing: border-box;
}

.layout-cinematic-16x9 .panel-A { 
    width: 100%;
    aspect-ratio: 16 / 9;
    position: relative;
    border-radius: 3px;
    /* You can override border colors in the JSON if needed */
}

/* Ensure the image scales perfectly without getting chopped */
.layout-cinematic-16x9 .panel-A > img {
    width: 100%;
    height: 100%;
    object-fit: contain !important; /* CHANGED FROM COVER TO CONTAIN */
    display: block;
    background-color: #000; /* Fills any remaining space with black */
}
</style>
<div class="section-container page-layout layout-cinematic-16x9">
    <div class="panel panel-A"></div>
</div>
