<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Four On Top (With Banner logic?)
    The CSS read from 'styles/' was actually for a 6-column grid with 3 panels top, 3 panels bottom.
    The filename is "layout-four-on-top-with-banner-three-on-bottom-grid".
    BUT the CSS had 3 top, 3 bottom.
    I will reconstruct it to match the Name better if possible, or stick to the CSS logic if it was used.
    CSS logic:
    Top: 1a (1/3), 1b (3/4), 1c (4/6) -> 3 panels.
    Bot: 2a (1/3), 2b (3/4), 2c (4/6) -> 3 panels.
    
    This matches neither "Four on top" nor "Banner".
    I will leave the file structure from the CSS I found but use explicit syntax.
*/
.page-layout.layout-four-on-top-with-banner-three-on-bottom-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
}

/* Row 1 */
.layout-four-on-top-with-banner-three-on-bottom-grid .panel-A {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
}
.layout-four-on-top-with-banner-three-on-bottom-grid .panel-B {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}
.layout-four-on-top-with-banner-three-on-bottom-grid .panel-C {
    grid-column: 4 / 7;
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-four-on-top-with-banner-three-on-bottom-grid .panel-E {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
}
.layout-four-on-top-with-banner-three-on-bottom-grid .panel-F {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}
.layout-four-on-top-with-banner-three-on-bottom-grid .panel-G {
    grid-column: 4 / 7;
    grid-row: 2 / 3;
}
</style>
<div class="section-container page-layout layout-four-on-top-with-banner-three-on-bottom-grid">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <!-- 1d not used in CSS but present in HTML? Removing to match CSS or keeping hidden? Keeping for safety -->
    <div class="panel panel-D" style="display:none;"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
    <div class="panel panel-G"></div>
</div>
