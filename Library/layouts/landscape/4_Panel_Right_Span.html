<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid 4 Right Span (Merged Bottom)
    
    Variation of the Right Span grid where the two bottom-left panels are merged into one wide frame.
    - Panel 1a & 1b: Top-left side-by-side pair.
    - Panel 1c: Tall vertical strip on the right.
    - Panel 2a: Wide merged panel at the bottom left.
*/
.page-layout.layout-4-panel-right-span {
    display: grid;
    grid-template-columns: 2fr 2fr 1.2fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Top Left Pair */
.layout-4-panel-right-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-4-panel-right-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* Right Panel: Tall (Vertical Strip) */
.layout-4-panel-right-span .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 3; /* Spans 2 rows */
}

/* Bottom Left Merged: Wide 16:9 style */
.layout-4-panel-right-span .panel-D {
    grid-column: 1 / 3; /* Spans both left and middle columns */
    grid-row: 2 / 3;
}
</style>

<div class="section-container page-layout layout-4-panel-right-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
