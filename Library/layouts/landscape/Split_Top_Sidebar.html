<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Split Top With Sidebar
    Grid: 1.2fr 1fr 1fr 2fr (Defined via template-cols)
*/
.page-layout.layout-split-mid-top-with-sidebar {
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Left Sidebar (Tall - 9:16 approx) */
.layout-split-mid-top-with-sidebar .panel-A {
    grid-column: 1 / 5;
    grid-row: 1 / 3;
}

/* Top Row (9:16 and 16:9) */
.layout-split-mid-top-with-sidebar .panel-B {
    grid-column: 5 / 8;
    grid-row: 1 / 2;
}
.layout-split-mid-top-with-sidebar .panel-C {
    grid-column: 8 / 11;
    grid-row: 1 / 2;
}
.layout-split-mid-top-with-sidebar .panel-D {
    grid-column: 11 / 19;
    grid-row: 1 / 2;
}

/* Bottom Row Masonry (16:9 staggered) */
.layout-split-mid-top-with-sidebar .panel-E {
    grid-column: 5 / 12;
    grid-row: 2 / 3;
}
.layout-split-mid-top-with-sidebar .panel-F {
    grid-column: 12 / 19;
    grid-row: 2 / 3;
}
</style>
<div class="section-container page-layout layout-split-mid-top-with-sidebar">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
