<style>
    @import url('/layouts/styles/base-comic-layout.css');

    /* 
    Layout: Grid_Mixed_TwoTall_OneStack
    
    Structure:
    - Column 1: Vertical Panel (9:16)
    - Column 2: Vertical Panel (9:16)
    - Column 3: Two Horizontal Panels (16:9) stacked vertically.
    
    Proportions (assuming total height 144 units):
    - Row Height: 72 units
    - Tall Panel (9:16): Width = 9/16 * 144 = 81 units
    - Wide Panel (16:9): Width = 16/9 * 72 = 128 units
    - Total Width: 81 + 81 + 128 = 290 units
    
    Grid Proportions: 81fr 81fr 128fr
*/
    .page-layout.layout-mixed-two-tall-stack {
        display: grid;
        grid-template-columns: 81fr 81fr 128fr;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
    }

    /* Column 1: Tall Vertical (9:16) */
    .layout-mixed-two-tall-stack .panel-A {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
    }

    /* Column 2: Tall Vertical (9:16) */
    .layout-mixed-two-tall-stack .panel-B {
        grid-column: 2 / 3;
        grid-row: 1 / 3;
    }

    /* Column 3: Top Stacked Wide (16:9) */
    .layout-mixed-two-tall-stack .panel-C {
        grid-column: 3 / 4;
        grid-row: 1 / 2;
    }

    /* Column 3: Bottom Stacked Wide (16:9) */
    .layout-mixed-two-tall-stack .panel-D {
        grid-column: 3 / 4;
        grid-row: 2 / 3;
    }
</style>
<div class="section-container page-layout layout-mixed-two-tall-stack">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
