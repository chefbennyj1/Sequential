<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: 3 Vertical Columns (9:16)
    Refactored to explicit grid syntax.
*/
.page-layout.layout-3-panel-vertical {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr;
    gap: 10px;
}

.layout-3-panel-vertical .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}

.layout-3-panel-vertical .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

.layout-3-panel-vertical .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}
</style>
<div class="section-container page-layout layout-3-panel-vertical">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
</div>
