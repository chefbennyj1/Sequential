<style>
@import url('/layouts/styles/base-comic-layout.css');

/*
    Layout: Grid 2x4 (Two columns, Four rows)
    Refactored to explicit grid syntax.
*/
.page-layout.layout-two-col-four-row-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
}

/* Row 1 */
.layout-two-col-four-row-grid .panel-A { 
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}
.layout-two-col-four-row-grid .panel-B { 
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}

/* Row 2 */
.layout-two-col-four-row-grid .panel-C { 
    grid-column: 1 / 2;
    grid-row: 2 / 3;
}
.layout-two-col-four-row-grid .panel-D { 
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}

/* Row 3 */
.layout-two-col-four-row-grid .panel-E { 
    grid-column: 1 / 2;
    grid-row: 3 / 4;
}
.layout-two-col-four-row-grid .panel-F { 
    grid-column: 2 / 3;
    grid-row: 3 / 4;
}

/* Row 4 */
.layout-two-col-four-row-grid .panel-G { 
    grid-column: 1 / 2;
    grid-row: 4 / 5;
}
.layout-two-col-four-row-grid .panel-H { 
    grid-column: 2 / 3;
    grid-row: 4 / 5;
}
</style>
<div class="section-container page-layout layout-two-col-four-row-grid">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
    <div class="panel panel-G"></div>
    <div class="panel panel-H"></div>
</div>
