<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid 4 Left Span (Asymmetrical Top Row)
    
    A specialized version of the Left Span Merged grid.
    - Panel 1a: Tall vertical strip on the left (Unchanged).
    - Panel 1b: Top-middle panel (Squished into a narrow rectangle).
    - Panel 1c: Top-right panel (Stretched into a cinematic widescreen rectangle).
    - Panel 2a: Wide merged panel at the bottom right (Unchanged total width).
*/
.page-layout.layout-grid-4-left-span-asym {
    display: grid;
    /* Adjusted weights: 1.2 (left) | 1fr (narrow middle) | 3fr (wide right) */
    grid-template-columns: 1.2fr 1fr 3fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Left Panel: Tall (Vertical Strip) */
.layout-grid-4-left-span-asym .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans 2 rows */
}

/* Top Right Pair (Asymmetrical) */
.layout-grid-4-left-span-asym .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-grid-4-left-span-asym .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}

/* Bottom Right Merged: Wide 16:9 style */
.layout-grid-4-left-span-asym .panel-D {
    grid-column: 2 / 4; /* Spans both middle and right columns */
    grid-row: 2 / 3;
}
</style>

<div class="section-container page-layout layout-grid-4-left-span-asym">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
