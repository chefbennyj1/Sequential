<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Stacked 4 Row Mix (Landscape)
    Matching version for the portrait 4-row layout.
*/
.page-layout.layout-stacked-4-row-mix {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

.layout-stacked-4-row-mix .panel-1a { grid-column: 1 / 3; grid-row: 1 / 2; }
.layout-stacked-4-row-mix .panel-1b { grid-column: 1 / 3; grid-row: 2 / 3; }
.layout-stacked-4-row-mix .panel-2a { grid-column: 1 / 2; grid-row: 3 / 4; }
.layout-stacked-4-row-mix .panel-2b { grid-column: 2 / 3; grid-row: 3 / 4; }
.layout-stacked-4-row-mix .panel-2c { grid-column: 1 / 3; grid-row: 4 / 5; }
</style>
<div class="section-container page-layout layout-stacked-4-row-mix">
    <div class="panel panel-1a"></div>
    <div class="panel panel-1b"></div>
    <div class="panel panel-2a"></div>
    <div class="panel panel-2b"></div>
    <div class="panel panel-2c"></div>
</div>
