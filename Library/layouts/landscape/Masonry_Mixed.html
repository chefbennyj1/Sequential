<style>
    @import url('/layouts/styles/base-comic-layout.css');

    /* 
    Layout: Masonry Mixed
    A 12-column complex grid creating an interlocking "Masonry" look.
    Perfect for montage sequences or chaotic action.
*/
    .page-layout.layout-masonry-mixed {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(12, 1fr);
        /* Granular rows for varying heights */
        gap: 12px;
    }

    /* 1. Tall Anchor (Top Left) */
    .layout-masonry-mixed .panel-A {
        grid-column: 1 / 7;
        grid-row: 1 / 7;
    }

    /* 2. Wide Hero (Top Right) */
    .layout-masonry-mixed .panel-B {
        grid-column: 7 / 13;
        grid-row: 1 / 8;
    }



    /* 5. Medium Square (Bottom Left) */
    .layout-masonry-mixed .panel-C {
        grid-column: 1 / 7;
        grid-row: 7 / 11;
    }

    /* 6. Tall Slim (Bottom Center) - EXTENDED to merge with old 2e */
    .layout-masonry-mixed .panel-D {
        grid-column: 7 / 8;
        grid-row: 8 / 13;
    }

    /* 7. Large Block (Bottom Right) */
    .layout-masonry-mixed .panel-E {
        grid-column: 8 / 13;
        grid-row: 8 / 13;
    }

    /* 8. Footer Strip (Bottom Left/Center) */
    .layout-masonry-mixed .panel-F {
        grid-column: 1 / 7;
        grid-row: 11 / 13;
    }
</style>
<div class="section-container page-layout layout-masonry-mixed">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>


    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
    <div class="panel panel-F"></div>
</div>
