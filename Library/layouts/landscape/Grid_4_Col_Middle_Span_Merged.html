<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Grid 4 Col Middle Span (Modified)
    Merged 1c and 1d into a single panel.
*/
.page-layout.layout-four-column-middle-span-merged {
    display: grid;
    /* 4 columns: 1fr 2fr 1fr 1fr */
    grid-template-columns: 1fr 2fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Row 1 */
.layout-four-column-middle-span-merged .panel-A { 
    grid-column: 1 / 2; 
    grid-row: 1 / 2; 
}
.layout-four-column-middle-span-merged .panel-B { 
    grid-column: 2 / 3; 
    grid-row: 1 / 3; 
}
/* Merged Panel 1c (formerly 1c + 1d) */
.layout-four-column-middle-span-merged .panel-C { 
    grid-column: 3 / 5; 
    grid-row: 1 / 2; 
}

/* Row 2 */
.layout-four-column-middle-span-merged .panel-D { 
    grid-column: 1 / 2; 
    grid-row: 2 / 3; 
}
.layout-four-column-middle-span-merged .panel-E { 
    grid-column: 3 / 5; 
    grid-row: 2 / 3; 
}

</style>
<div class="section-container page-layout layout-four-column-middle-span-merged">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
