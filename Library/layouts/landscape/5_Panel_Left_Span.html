<style>
@import url('/layouts/styles/base-comic-layout.css');

/* 
    Layout: Four Panel Grid with Left Side Span
    Refactored to explicit grid syntax.
*/
.page-layout.layout-5-panel-left-span {
    display: grid;
    /* Columns: 1.2fr 2fr 2fr */
    grid-template-columns: 1.2fr 2fr 2fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
}

/* Left Panel: Tall (Vertical Strip) */
.layout-5-panel-left-span .panel-A {
    grid-column: 1 / 2;
    grid-row: 1 / 3; /* Spans 2 rows */
}

/* Top Right Pair */
.layout-5-panel-left-span .panel-B {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
}
.layout-5-panel-left-span .panel-C {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
}

/* Bottom Right Pair */
.layout-5-panel-left-span .panel-D {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
}
.layout-5-panel-left-span .panel-E {
    grid-column: 3 / 4;
    grid-row: 2 / 3;
}
</style>
<div class="section-container page-layout layout-5-panel-left-span">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
    <div class="panel panel-E"></div>
</div>
