<style>
    @import url('/layouts/styles/base-comic-layout.css');

    /* 
    Layout: 3-Column Mixed (Two Tall, One Stacked)
    
    Structure:
    - Column 1: Vertical Panel (9:16)
    - Column 2: Vertical Panel (9:16)
    - Column 3: Two Horizontal Panels (16:9) stacked vertically.
*/
    .page-layout.layout-3col-double-tall-stack {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
    }

    /* Column 1: Tall Vertical */
    .layout-3col-double-tall-stack .panel-A {
        grid-column: 1 / 5;
        grid-row: 1 / 3;
    }

    /* Column 3: Top Stacked Wide */
    .layout-3col-double-tall-stack .panel-B {
        grid-column: 5 / 9;
        grid-row: 1 / 2;
    }

    /* Column 3: Bottom Stacked Wide */
    .layout-3col-double-tall-stack .panel-C {
        grid-column: 9 / 13;
        grid-row: 1 / 3;
    }

    /* Column 2: Tall Vertical */
    .layout-3col-double-tall-stack .panel-D {
        grid-column: 5 / 9;
        grid-row: 2 / 3;
    }
</style>
<div class="section-container page-layout layout-3col-double-tall-stack">
    <div class="panel panel-A"></div>
    <div class="panel panel-B"></div>
    <div class="panel panel-C"></div>
    <div class="panel panel-D"></div>
</div>
